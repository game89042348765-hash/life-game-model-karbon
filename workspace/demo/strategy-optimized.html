function validate(s){
 if(!s||s.version!==1||!Number.isInteger(s.uid)||!Array.isArray(s.blocks)||!s.blocks.length||!Array.isArray(s.tasks))throw Error('Некорректные данные демо');

a-id="${id}" style="color:#dba68e">Удалить этот этап</button>`:''}`,`<button class="btn" data-act="close">Отмена</button><button class="btn primary" type="submit" form="stage-form">${id?'Сохранить':'Добавить этап'}</button>`,'editor');const value=a.gate?(a.gate.mode==='manual'?'manual':a.gate.mode+'|'+a.gate.source):'';$('#stage-gate').value=value;}
function collectRows(type){return $$(`[data-editrow=${type}]`,dialog).map(r=>({id:r.dataset.id,title:$('input[type=text]',r).value.trim(),repeat:!!$('[data-repeat]',r)?.checked})).filter(x=>x.title)}
function saveEditor(){const d=ui.draft;if(!d||d.kind!=='stage')return;const title=$('#stage-title').value.trim();if(!title){error('Назови этап.');$('#stage-title').focus();return}const meaning=$('#stage-meaning').value.trim(),goals=collectRows('goal'),rows=collectRows('task'),gateValue=$('#stage-gate').value,optimum=$('#stage-optimum').checked;const ok=change(s=>{const b=block(d.blockId,s),existing=d.id?stage(d.id,s).a:null,a=existing||{id:uid(s),reached:false,finished:false,taskIds:[],goals:[],gate:null};const past=a.reached&&a.id!==b.current;const beforeGoals=a.goals;const gs=goals.map(x=>{const old=beforeGoals.find(g=>g.id===x.id);return {id:old?.id||uid(s),title:x.title,done:old?.done||false}});const removed=beforeGoals.filter(g=>!gs.some(x=>x.id===g.id));for(const x of removed){const dependent=s.blocks.flatMap(b=>b.stages).find(a=>a.gate?.mode==='goal'&&a.gate.source===x.id);if(dependent)throw Error(`Цель «${x.title}» открывает этап «${dependent.title}». Сначала измени его условие.`)}a.title=title;a.meaning=meaning;a.goals=gs;if(!past){a.taskIds=rows.map(x=>{let t=x.id?task(x.id,s):null;if(t){t.title=x.title;t.repeat=x.repeat}else{t={id:uid(s),blockId:b.id,title:x.title,repeat:x.repeat,days:[],doneAt:null};s.tasks.push(t)}return t.id})}if(!a.reached){if(gateValue==='manual')a.gate={mode:'manual',ready:a.gate?.mode==='manual'&&!!a.gate.ready};else if(gateValue){const [mode,source]=gateValue.split('|');a.gate={mode,source}}else a.gate=null}a.optimum=optimum;if(optimum)b.stages.forEach(x=>{if(x.id!==a.id)x.optimum=false});if(!existing){const at=b.stages.findIndex(x=>x.optimum);if(at>=0&&!optimum)b.stages.splice(at,0,a);else b.stages.push(a)}});if(!ok){operationFailed();return}closeDialog();render();toast('Этап сохранён')}
function transition(id){const ref=stage(id);if(!ref||ref.a.id===ref.b.current)return;if(!ready(ref.a)){stageDialog(id);return}const old=current(ref.b),ts=tasks(old);ui.draft={kind:'transition',id,blockId:ref.b.id,from:old.id};openDialog('Перейти к этапу?',`<div class="stagehead" style="--c:${ref.b.color}"><i class="ring"></i><div><div class="statuspill">${esc(ref.b.name)}</div><h2>${esc(ref.a.title)}</h2></div></div>${ts.length?`<p class="muted">Какие дела продолжать дальше?</p>${ts.map(t=>`<div class="carry"><label class="toggle"><input type="checkbox" data-carry="${t.id}" ${t.repeat?'checked':''}><span>${esc(t.title)}</span></label><small>${t.repeat?'Каждый день':isDone(t)?'Уже сделано':'Разовое дело'}${isDone(t)?' · отметка сохранится':''}</small></div>`).join('')}`:'<p class="muted">Подготовленные дела нового этапа появятся на экране «Сейчас».</p>'}<div class="softdivider"></div><label class="toggle"><input type="checkbox" id="finish-stage" ${!ref.a.reached?'checked':''}><span>Отметить «${esc(old.title)}» пройденным</span></label><p class="help">Цели и дела не отмечаются автоматически. Предыдущий этап останется в истории.</p>`,`<button class="btn" data-act="close">Отмена</button><button class="btn primary" data-act="confirm-transition">Перейти</button>`,'transition')}
function confirmTransition(){const d=ui.draft;if(!d||d.kind!=='transition')return;const carried=$$('[data-carry]:checked',dialog).map(x=>x.dataset.carry),finished=$('#finish-stage').checked;const ok=change(s=>{const b=block(d.blockId,s),a=stage(d.id,s)?.a;if(b.current!==d.from||!a||!ready(a,s))throw Error('Путь изменился. Открой переход заново.');const old=current(b);old.snapshot=tasks(old,s).map(t=>({id:t.id,title:t.title,done:isDone(t)}));old.finished=finished;old.reached=true;a.taskIds=[...new Set([...a.taskIds,...carried.filter(id=>old.taskIds.includes(id))])];a.reached=true;a.finished=false;b.current=a.id});if(!ok){operationFailed();return}ui.block=d.blockId;closeDialog();ui.tab='now';render();window.scrollTo({top:0});toast('Новый этап. Выбранные дела продолжаются.')}
function newBlock(){ui.draft={kind:'block',color:colors[0]};openDialog('Новое направление',`<form id="block-form"><label class="field" for="block-name">Направление</label><input type="text" id="block-name" maxlength="120" required placeholder="Например: гитара"><label class="field" for="block-first-task">С какого дела начнёшь? · необязательно</label><input type="text" id="block-first-task" maxlength="180" placeholder="Играть 20 минут"><label class="toggle"><input type="checkbox" id="block-repeat" checked><span>Повторять это дело каждый день</span></label><details class="formmore"><summary>Описать направление подробнее</summary><div class="presets">${presets.filter(x=>!S.blocks.some(b=>b.name===x[0])).map(([name,c])=>`<button type="button" class="chip" data-preset="${esc(name)}" data-color="${c}" style="--c:${c}"><i class="dot"></i>${esc(name)}</button>`).join('')}</div><label class="field" for="block-stage">Название текущего этапа</label><input type="text" id="block-stage" maxlength="120" placeholder="Первые шаги"><label class="field" for="block-meaning">Зачем мне это направление</label><textarea id="block-meaning" maxlength="500"></textarea><label class="field" for="block-fact">Как сейчас</label><textarea id="block-fact" maxlength="500"></textarea><label class="field" for="block-optimum">Желаемый устойчивый уровень</label><input type="text" id="block-optimum" maxlength="120" placeholder="Можно решить позже"><label class="field" for="block-maximum">За этим горизонтом</label><textarea id="block-maximum" maxlength="500"></textarea><label class="field">Цвет направления</label><div class="swatches">${colors.map((c,i)=>`<button type="button" data-swatch="${c}" style="--c:${c}" aria-pressed="${i===0}" aria-label="Цвет ${c}"><i></i></button>`).join('')}</div></details></form>`,`<button class="btn" data-act="close">Отмена</button><button class="btn primary" type="submit" form="block-form">Начать</button>`,'newblock')}
function saveBlock(){const name=$('#block-name').value.trim(),first=$('#block-first-task').value.trim(),title=$('#block-stage').value.trim()||'Первые шаги',meaning=$('#block-meaning').value.trim(),fact=$('#block-fact').value.trim(),maximum=$('#block-maximum').value.trim(),optimal=$('#block-optimum').value.trim(),repeat=$('#block-repeat').checked,color=ui.draft.color;if(!name){error('Назови направление.');return}let newId;const ok=change(s=>{newId=uid(s);const firstStage=uid(s),taskIds=[];if(first){const id=uid(s);s.tasks.push({id,blockId:newId,title:first,repeat,days:[],doneAt:null});taskIds.push(id)}const b={id:newId,name,color,meaning,fact,maximum,current:firstStage,stages:[{id:firstStage,title,meaning:'',reached:true,finished:false,optimum:false,goals:[],taskIds,gate:null}]};if(optimal)b.stages.push({id:uid(s),title:optimal,meaning:'',reached:false,finished:false,optimum:true,goals:[],taskIds:[],gate:null});s.blocks.push(b)});if(!ok){operationFailed();return}ui.block=newId;ui.tab='now';closeDialog();render();toast('Начни с одного дела')}
function blockMeta(){const b=block();ui.draft={kind:'meta',id:b.id};openDialog('Ориентиры направления',`<form id="meta-form"><label class="field" for="meta-meaning">Зачем мне это направление</label><textarea id="meta-meaning" maxlength="500">${esc(b.meaning)}</textarea><label class="field" for="meta-fact">Моя исходная точка</label><textarea id="meta-fact" maxlength="500">${esc(b.fact)}</textarea><label class="field" for="meta-maximum">За этим горизонтом</label><textarea id="meta-maximum" maxlength="500">${esc(b.maximum)}</textarea><p class="help">Желаемый уровень можно отметить в редакторе любого этапа. Все описания добровольные.</p></form>`,`<button class="btn" data-act="close">Отмена</button><button class="btn primary" type="submit" form="meta-form">Сохранить</button>`,'meta')}
function deleteStage(id){const ref=stage(id);if(!ref||ref.a.reached)return;const dependency=S.blocks.flatMap(b=>b.stages).find(a=>a.id!==id&&(a.gate?.mode==='stage'&&a.gate.source===id||a.gate?.mode==='goal'&&ref.a.goals.some(g=>g.id===a.gate.source)));if(dependency){error(`Этот этап открывает «${dependency.title}». Сначала измени его условие.`);return}ui.draft={kind:'delete',id};openDialog('Удалить будущий этап?',`<p class="muted">«${esc(ref.a.title)}» и его подготовленные записи будут удалены. Пройденные этапы и история останутся.</p>`,`<button class="btn" data-act="edit" data-id="${id}">Отмена</button><button class="btn danger" data-act="confirm-delete" data-id="${id}">Удалить</button>`,'delete')}
function resetDialog(){openDialog('Начать пример заново?',`<p class="muted">Изменения только в этом демо будут заменены исходным примером: здоровье, ресурсы и семья.</p>`,`<button class="btn" data-act="close">Отмена</button><button class="btn danger" data-act="confirm-reset">Начать заново</button>`,'reset')}
function refreshAfterAction(stageId){const old=document.activeElement,act=old?.dataset.act,id=old?.dataset.id;render();if(dialog.open&&dialog.dataset.kind==='stage')stageDialog(stageId);if(act&&id)$(`[data-act="${CSS.escape(act)}"][data-id="${CSS.escape(id)}"]`,dialog.open?dialog:$('#content'))?.focus({preventScroll:true})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-block],[data-act],[data-preset],[data-swatch]');if(!el)return;
 if(el.dataset.tab){ui.tab=el.dataset.tab;render();return}if(el.dataset.block){ui.block=el.dataset.block;render();return}
 if(el.dataset.preset){$('#block-name').value=el.dataset.preset;ui.draft.color=el.dataset.color;$$('[data-swatch]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.swatch===ui.draft.color)));return}
 if(el.dataset.swatch){ui.draft.color=el.dataset.swatch;$$('[data-swatch]').forEach(x=>x.setAttribute('aria-pressed',String(x===el)));return}
 const id=el.dataset.id;switch(el.dataset.act){
 case 'close':closeDialog();break;
 case 'about':openDialog('Об этом демо','<p class="muted">Один путь от небольшого дела к желаемому уровню. Можно готовить будущие этапы, связывать направления и выбирать, какие дела продолжать.</p><p class="notice">Изменения сохраняются в этом браузере отдельно от приложения. Здесь вымышленные данные, без игровых наград.</p>','<button class="btn" data-act="reset">Начать заново</button><button class="btn primary" data-act="close">Понятно</button>','about');break;
 case 'newblock':newBlock();break;case 'blockmeta':blockMeta();break;case 'edit':editor(id);break;case 'addstage':editor(null);break;
 case 'stage':stageDialog(id);break;case 'transition':transition(id);break;case 'confirm-transition':confirmTransition();break;
 case 'tabpath':ui.tab='path';render();break;case 'selectpath':ui.block=id;ui.tab='path';render();break;
 case 'add-task-row':$('#task-rows').insertAdjacentHTML('beforeend',rowEditor('task'));$('#task-rows .editrow:last-child input[type=text]').focus();break;
 case 'add-goal-row':$('#goal-rows').insertAdjacentHTML('beforeend',rowEditor('goal'));$('#goal-rows .editrow:last-child input[type=text]').focus();break;
 case 'remove-row':el.closest('.editrow').remove();break;
 case 'task':{const t=task(id),b=block(t?.blockId),a=b&&current(b);if(!t||!a.taskIds.includes(id))return;const ok=change(s=>{const x=task(id,s);if(x.repeat)x.days=isDone(x)?x.days.filter(d=>d!==day()):[...x.days,day()];else x.doneAt=x.doneAt?null:day()});if(ok)refreshAfterAction(a.id);else operationFailed();break}
 case 'goal':{const ref=goal(id);if(!ref||ref.a.id!==ref.b.current)return;const before=S.blocks.flatMap(b=>b.stages).filter(a=>!ready(a)).map(a=>a.id);const ok=change(s=>{const x=goal(id,s).g;x.done=!x.done});if(ok){refreshAfterAction(ref.a.id);const unlocked=before.map(id=>stage(id)?.a).find(a=>a&&ready(a));if(unlocked)toast(`Открылся этап «${unlocked.title}»`)}else operationFailed();break}
 case 'manual':ui.draft={kind:'manual',id};openDialog('Открыть этап?',`<p class="muted">Ты подтверждаешь готовность к этапу «${esc(stage(id).a.title)}». Он станет доступным, но не переключится автоматически.</p>`,`<button class="btn" data-act="stage" data-id="${id}">Отмена</button><button class="btn primary" data-act="confirm-manual" data-id="${id}">Открыть</button>`,'manual');break;
 case 'confirm-manual':if(change(s=>{stage(id,s).a.gate.ready=true})){render();stageDialog(id)}else operationFailed();break;
 case 'delete-stage':deleteStage(id);break;
 case 'confirm-delete':if(change(s=>{const b=stage(id,s).b;b.stages=b.stages.filter(a=>a.id!==id)})){closeDialog();render();toast('Будущий этап удалён')}else operationFailed();break;
 case 'reset':resetDialog();break;
 case 'confirm-reset':if(persist(fresh(),true)){closeDialog();ui.block=S.blocks[0].id;ui.tab='now';ui.mapFilter='all';render();toast('Пример начат заново')}else operationFailed();break;
 }});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='stage-form')saveEditor();else if(e.target.id==='block-form')saveBlock();else if(e.target.id==='meta-form'){const values={meaning:$('#meta-meaning').value.trim(),fact:$('#meta-fact').value.trim(),maximum:$('#meta-maximum').value.trim()},id=ui.draft.id;if(change(s=>Object.assign(block(id,s),values))){closeDialog();render()}else operationFailed()}});
document.addEventListener('change',e=>{if(e.target.id==='map-filter'){ui.mapFilter=e.target.value;render()}});
dialog.addEventListener('cancel',e=>{e.preventDefault();closeDialog()});dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog()});
$$('[role=tab]').forEach((t,i,all)=>t.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const n=e.key==='Home'?0:e.key==='End'?all.length-1:(i+(e.key==='ArrowRight'?1:-1)+all.length)%all.length;all[n].click();all[n].focus()}));
function viewport(){document.documentElement.style.setProperty('--vh',(window.visualViewport?.height||innerHeight)+'px')}viewport();window.visualViewport?.addEventListener('resize',viewport);window.addEventListener('resize',viewport);setInterval(()=>{if(day()!==ui.date)render()},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&day()!==ui.date)render()});
render();
})();
