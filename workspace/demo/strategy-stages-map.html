<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111213"><title>LifeGame — карта этапов</title><style>:root{color-scheme:dark;--bg:#111213;--panel:#202123;--edge:#343638;--text:#eeede9;--muted:#999c9f;--health:#8bceac;--money:#92b7ee;--goal:#e6c76c;--meaning:#bda3df;--lock:#e6b86d;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible{outline:2px solid var(--goal);outline-offset:3px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}button:disabled{opacity:.35;cursor:default}.shell{height:100%;max-width:1000px;margin:auto;display:flex;flex-direction:column}.header{padding:max(18px,env(safe-area-inset-top)) 20px 14px;border-bottom:1px solid #2a2c2d;flex:none}.brand-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.brand{font-size:10px;letter-spacing:1.7px;font-weight:700}.brand:before{content:'';display:inline-block;width:5px;height:5px;background:var(--goal);border-radius:50%;margin-right:8px;vertical-align:2px}.demo-tag{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.heading-row{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:25px;letter-spacing:-.6px;line-height:1.1;margin:0}.header p{color:var(--muted);font-size:12px;line-height:1.4;margin:7px 0 0}.jump{min-height:44px;padding:8px 10px;background:#242222;color:var(--lock);border:1px solid #514332;border-radius:12px;display:flex;align-items:center;gap:7px;font-size:11px;flex:none}.jump svg{width:14px;height:14px}.legend{flex:none;display:flex;align-items:center;gap:18px;padding:13px 20px 0;color:var(--muted);font-size:10px;line-height:1.2}.legend span{display:flex;align-items:center;gap:7px}.legend .stage-symbol{width:11px;height:11px;border-radius:50%;background:var(--health)}.legend .goal-symbol{width:6px;height:6px;border-radius:50%;background:var(--goal)}.legend .link-symbol{width:20px;border-top:1px dashed var(--lock)}.board-wrap{position:relative;flex:1;min-height:0;margin-top:4px;overflow:hidden}.board{height:100%;width:100%;position:relative;overflow:hidden;touch-action:none;user-select:none;background-image:radial-gradient(circle,#4f51552b .8px,transparent .9px);background-size:22px 22px;cursor:grab;outline:none}.board.dragging{cursor:grabbing}.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;stroke:none}.edges path{fill:none;stroke-width:1;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}.edges .order{opacity:.3}.edges .goal-edge{opacity:.35}.edges .dependency{stroke:var(--lock);stroke-width:1.5;stroke-dasharray:4 6;opacity:.8}.edges .dependency.emphasis{stroke-width:2;opacity:1}.node-layer{position:absolute;inset:0;pointer-events:none}.node{position:absolute;left:0;top:0;width:44px;height:44px;padding:0;border:0;background:transparent;border-radius:50%;transform:translate(-22px,-22px);pointer-events:auto;color:var(--c);text-align:left;isolation:isolate}.node .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:13px;height:13px;border:1.5px solid var(--c);background:var(--bg);border-radius:50%;transition:background .15s}.node.current .dot{background:var(--c);width:14px;height:14px}.node.current .dot:before{content:'';position:absolute;inset:-6px;border:1px solid var(--c);border-radius:50%;opacity:.4}.node.selected .dot:after{content:'';position:absolute;inset:-10px;border:1px solid var(--c);border-radius:50%}.node.locked .dot:before{content:'';position:absolute;inset:-6px;border:1px dashed var(--lock);border-radius:50%}.node.block .dot{width:18px;height:18px;background:var(--c);border:5px solid var(--bg);outline:1px solid var(--c)}.node.goal .dot{width:7px;height:7px;background:var(--goal);border:0}.node.goal.locked .dot{background:var(--bg);border:1px solid var(--goal)}.node .label{position:absolute;top:9px;left:42px;width:var(--label-width,122px);color:var(--text);font-size:12px;font-weight:600;line-height:1.35;overflow-wrap:anywhere}.node.block .label{top:6px;line-height:1.35;font-size:13px;color:var(--c)}.node .sub{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:4px;line-height:1.25}.node.current .sub{color:var(--c)}.node.goal .label{font-size:10.5px;line-height:1.4;font-weight:400;color:#bcbcb7;top:13px;left:36px;width:calc(var(--label-width,122px) - 8px)}.node.locked .label{color:#d6d2c8}.tiny-lock{width:10px;height:10px;vertical-align:-1px;margin-right:3px;color:var(--lock)}.dependency-label{position:absolute;left:0;top:0;transform:translate(-50%,-50%);border:1px solid #4b4235;background:#23211e;color:var(--lock);height:34px;padding:0 10px;border-radius:18px;display:flex;gap:6px;align-items:center;font-size:10px;white-space:nowrap;pointer-events:auto}.dependency-label svg{width:12px;height:12px}.controls{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:row;background:#1c1d1f;border:1px solid var(--edge);border-radius:14px;overflow:hidden;box-shadow:0 4px 15px #0002}.controls button{width:44px;height:44px;background:none;border:0;display:grid;place-items:center}.controls button+button{border-left:1px solid #303234}.controls button svg{width:17px;height:17px}.hint{flex:none;text-align:center;color:#85898d;font-size:10px;padding:11px 15px max(13px,env(safe-area-inset-bottom));margin:0;border-top:1px solid #252729;line-height:1.4}.details{position:absolute;left:10px;right:10px;bottom:10px;max-height:56%;max-height:min(48dvh,430px);background:var(--panel);border:1px solid #444648;border-radius:22px;box-shadow:0 -12px 50px #0005;overflow:auto;overscroll-behavior:contain;padding:0 18px 19px;z-index:5}.details[hidden]{display:none}.details-head{position:sticky;top:0;z-index:1;background:var(--panel);display:flex;justify-content:space-between;align-items:start;gap:10px;padding:17px 0 10px}.crumb{font-size:10px;line-height:1.4;color:var(--c,var(--muted));margin:0 0 5px}.details h2{font-size:21px;line-height:1.2;letter-spacing:-.3px;margin:0;overflow-wrap:anywhere}.close{width:44px;height:44px;min-width:44px;background:#282a2c;border:1px solid #424548;display:grid;place-items:center;border-radius:50%;margin-top:-2px}.status{font-size:11px;color:var(--muted);margin:4px 0 17px;display:flex;gap:7px;align-items:center}.status .status-dot{width:5px;height:5px;border-radius:50%;background:var(--c)}.section{border-top:1px solid #37393b;padding-top:14px;margin-top:14px}.eyebrow{display:flex;gap:7px;align-items:center;font-size:10px;color:var(--muted);margin:0 0 7px;letter-spacing:.3px}.eyebrow:before{content:'';width:5px;height:5px;border-radius:50%;background:var(--meaning)}.section.goal-copy .eyebrow:before{background:var(--goal)}.section p.copy{font-size:14px;line-height:1.5;margin:0;color:#e1e1dc}.section.goal-copy p.copy{font-weight:600}.task-row{display:flex;align-items:start;gap:9px;font-size:13px;line-height:1.5;margin:11px 0}.task-row:before{content:'';width:5px;height:5px;min-width:5px;background:#a2a5a7;border-radius:50%;margin-top:6px}.section.tasks .eyebrow:before{background:#a2a5a7}.lock-box{padding:13px 14px;margin:14px 0 0;border:1px solid #65523a;border-radius:13px;background:#29251f}.lock-title{font-size:11px;color:var(--lock);display:flex;align-items:center;gap:7px;margin:0 0 7px}.lock-title svg{width:13px;height:13px}.lock-box p{font-size:12px;color:#d8ccba;line-height:1.5;margin:0}.text-link{min-height:42px;background:none;border:0;color:var(--money);font-size:12px;padding:10px 0 0;display:flex;gap:8px;align-items:center;text-align:left}.text-link svg{width:14px;height:14px}.read-only{font-size:10px;line-height:1.5;color:#8c9093;margin:16px 0 0}.stage-list{padding:0;margin:12px 0 0;list-style:none}.stage-list button{width:100%;display:flex;align-items:center;gap:11px;background:transparent;border:0;border-top:1px solid #37393b;text-align:left;padding:13px 0;min-height:50px;font-size:13px}.stage-list .list-dot{width:8px;height:8px;border:1px solid var(--c);border-radius:50%;flex:none}.stage-list button.current .list-dot{background:var(--c)}.stage-list small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.stage-list svg{margin-left:auto;width:14px;height:14px;color:var(--muted)}.board-wrap.has-details .controls{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:650px){.header{padding-left:28px;padding-right:28px}.legend{padding-left:28px}.details{left:auto;width:350px;right:18px;bottom:18px;max-height:calc(100% - 36px)}.board-wrap.has-details .controls{bottom:18px;right:386px}.node .label{font-size:13px}.node.goal .label{font-size:11px}}@media(max-height:650px){.brand-row{margin-bottom:9px}.header{padding-top:12px;padding-bottom:10px}.header p{font-size:11px;margin-top:5px}.legend{padding-top:10px}.details{max-height:70%}.board-wrap.has-details .controls{bottom:auto;top:8px}.hint{padding-top:8px;padding-bottom:max(8px,env(safe-area-inset-bottom))}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div class="shell"><header class="header"><div class="brand-row"><span class="brand">LIFE / GAME</span><span class="demo-tag">Демо карты</span></div><div class="heading-row"><h1>Стратегия</h1><button class="jump" id="jump-lock" type="button"></button></div><p>Твой путь по этапам. И связи между ними.</p></header>
<div class="legend" aria-label="Обозначения"><span><i class="stage-symbol"></i>Этап</span><span><i class="goal-symbol"></i>Цель</span><span><i class="link-symbol"></i>Условие</span></div>
<main id="board-wrap" class="board-wrap"><div class="board" id="board" role="region" aria-label="Карта этапов и целей" aria-describedby="map-hint" tabindex="0"><svg class="edges" aria-hidden="true"><defs><marker id="small-arrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0 4 2.5 0 5" fill="none" stroke="#777c7d" stroke-width="1"/></marker><marker id="lock-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 6 3.5 0 7" fill="none" stroke="#e6b86d" stroke-width="1"/></marker></defs><g id="edge-world"></g></svg><div id="nodes" class="node-layer"></div></div>
<div class="controls" role="group" aria-label="Управление картой"><button type="button" id="zoom-in" aria-label="Приблизить"></button><button type="button" id="zoom-out" aria-label="Отдалить"></button><button type="button" id="reset" aria-label="Вернуться к текущим этапам"></button></div>
<section class="details" id="details" aria-labelledby="detail-title" hidden><div id="details-content"></div></section></main><p class="hint" id="map-hint">Нажми на точку · двигай карту пальцем</p><span class="sr-only" id="selection-status" role="status" aria-live="polite"></span></div><script>'use strict';
(()=>{
  // Read-only UX sample. Each stage owns its meaning, goals and tasks.
  const blocks=[
    {id:'health',name:'Физическое здоровье',lines:['Физическое','здоровье'],color:'#8bceac',x:30,stages:[
      {id:'health-now',title:'Базовый режим',current:true,meaning:'Хочу начать чувствовать себя хорошо.',goals:[{title:'Наладить базовое меню',short:'Наладить меню'}],tasks:['Прогулка 15 минут каждый день','Соблюдать график сна']},
      {id:'health-energy',title:'Больше энергии',meaning:'Хочу свободнее двигаться и меньше уставать.',goals:[{title:'Найти комфортный ритм движения',short:'Ритм движения'}],tasks:['Подобрать лёгкую зарядку','Найти удобное время для тренировок']},
      {id:'health-checkups',title:'Плановые чекапы',meaning:'Хочу понимать своё состояние и заботиться о себе заранее.',goals:[{title:'Пройти плановое обследование',short:'Пройти обследование'}],tasks:['Выбрать клинику','Обсудить с врачом план обследования'],requires:'money-health'}
    ]},
    {id:'money',name:'Ресурсы и материальное',lines:['Ресурсы','и материальное'],color:'#92b7ee',x:245,stages:[
      {id:'money-now',title:'Порядок в деньгах',current:true,meaning:'Хочу понимать, куда уходят деньги, и чувствовать спокойствие.',goals:[{title:'Разобраться в повседневных расходах',short:'Понятный бюджет'}],tasks:['Посмотреть расходы за неделю','Выписать обязательные траты']},
      {id:'money-health',title:'Резерв на здоровье',meaning:'Хочу иметь возможность заботиться о здоровье без спешки.',goals:[{title:'Выделить деньги на плановый чекап',short:'Деньги на чекап'}],tasks:['Узнать примерную стоимость','Выбрать посильную сумму для резерва']},
      {id:'money-steady',title:'Устойчивая база',meaning:'Хочу иметь больше опоры и свободы выбора.',goals:[{title:'Регулярно пополнять финансовый резерв',short:'Пополнять резерв'}],tasks:['Пересмотреть ежемесячный бюджет','Выбрать удобный ритм пополнения']}
    ]}
  ];
  const stageY=i=>130+i*210,goalOffset=82,W=440,H=680;
  const $=id=>document.getElementById(id),board=$('board'),wrap=$('board-wrap'),layer=$('nodes'),edgeWorld=$('edge-world'),panel=$('details'),content=$('details-content');
  const camera={x:0,y:0,scale:1};let selected=null,returnFocus=null,panMoved=false;
  const nodes=[];const byStage=id=>{for(const b of blocks){const i=b.stages.findIndex(s=>s.id===id);if(i>=0)return {b,s:b.stages[i],i};}return null;};
  const svgNS='http://www.w3.org/2000/svg';
  const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  const symbols={close:'m6 6 12 12M6 18 18 6',lock:'M6 10h12v11H6ZM8 10V6a4 4 0 0 1 8 0v4',plus:'M5 12h14M12 5v14',minus:'M5 12h14',reset:'M4 10a8 8 0 1 1 0 5M4 4v6h6',arrow:'M4 12h15m-5-5 5 5-5 5',chevron:'m9 5 7 7-7 7'};
  function icon(name,cls=''){const n=document.createElementNS(svgNS,'svg');n.setAttribute('viewBox','0 0 24 24');n.setAttribute('aria-hidden','true');if(cls)n.setAttribute('class',cls);const path=document.createElementNS(svgNS,'path');path.setAttribute('d',symbols[name]);n.append(path);return n;}
  function button(text,cls,action,glyph){const n=el('button',cls);n.type='button';if(glyph)n.append(icon(glyph));if(text)n.append(document.createTextNode(text));n.addEventListener('click',action);return n;}
  function edge(d,color,cls='',arrow=false){const p=document.createElementNS(svgNS,'path');p.setAttribute('d',d);p.setAttribute('stroke',color);p.setAttribute('class',cls);if(arrow)p.setAttribute('marker-end','url(#'+(cls.includes('dependency')?'lock-arrow':'small-arrow')+')');edgeWorld.append(p);return p;}
  function makeNode(kind,b,s=null,i=0){
    const point={kind,b,s,x:b.x,y:kind==='block'?32:stageY(i)+(kind==='goal'?goalOffset:0),id:kind==='block'?b.id:kind==='goal'?s.id+'-goal':s.id};if(kind==='goal')point.x+=20;
    const n=button('','node '+kind+(s?.current&&kind==='stage'?' current':'')+(s?.requires?' locked':''),e=>{if(panMoved&&e.detail!==0){e.preventDefault();return;}show(point);});
    n.style.setProperty('--c',kind==='goal'?'var(--goal)':b.color);n.dataset.node=point.id;n.setAttribute('aria-controls','details');n.setAttribute('aria-expanded','false');n.setAttribute('aria-label',kind==='block'?'Блок: '+b.name:kind==='goal'?'Цель: '+s.goals[0].title:(s.requires?'Заблокированный этап: ':s.current?'Текущий этап: ':'Этап: ')+s.title);
    const dot=el('span','dot'),label=el('span','label');
    if(kind==='block'){label.append(document.createTextNode(b.lines[0]),el('br'),document.createTextNode(b.lines[1]));}
    else if(kind==='goal')label.textContent=s.goals[0].short;
    else{label.append(document.createTextNode(s.title));const sub=el('span','sub');if(s.requires)sub.append(icon('lock','tiny-lock'));sub.append(document.createTextNode(s.current?'Сейчас · этап '+(i+1):'Этап '+(i+1)+(s.requires?' · закрыт':'')));label.append(sub);}
    n.append(dot,label);n.addEventListener('focus',()=>{if(n.matches(':focus-visible'))ensureVisible(point);});layer.append(n);point.button=n;nodes.push(point);return point;
  }
  function build(){
    for(const b of blocks){makeNode('block',b);edge(`M${b.x} 57V106`,b.color,'order',true);for(let i=0;i<b.stages.length;i++){
      const s=b.stages[i],y=stageY(i);makeNode('stage',b,s,i);makeNode('goal',b,s,i);
      edge(`M${b.x} ${y+15}V${y+goalOffset-16}Q${b.x} ${y+goalOffset} ${b.x+14} ${y+goalOffset}`,b.color,'goal-edge');
      if(i<b.stages.length-1)edge(`M${b.x} ${y+goalOffset+16}V${stageY(i+1)-22}`,b.color,'order',true);
    }}
    // The only cross-block condition is reaching this named stage, not buying or completing its goal.
    edge('M232 340H217Q201 340 201 356V486Q201 506 180 506H54Q30 506 30 524','var(--lock)','dependency',true);
    const dependency=button('Нужен этап','dependency-label',()=>show(nodes.find(n=>n.id==='health-checkups')),'lock');dependency.setAttribute('aria-label','Почему чекапы закрыты');layer.append(dependency);nodes.push({id:'dependency',kind:'dependency',x:201,y:448,button:dependency});
  }
  function bounds(){return {w:board.clientWidth,h:board.clientHeight};}
  function paint(){
    edgeWorld.setAttribute('transform',`translate(${camera.x} ${camera.y}) scale(${camera.scale})`);
    const labelWidth=Math.max(98,Math.min(142,215*camera.scale-40));
    layer.style.setProperty('--label-width',labelWidth+'px');
    for(const n of nodes){n.button.style.left=(camera.x+n.x*camera.scale)+'px';n.button.style.top=(camera.y+n.y*camera.scale)+'px';}
    $('zoom-out').disabled=camera.scale<=.65;$('zoom-in').disabled=camera.scale>=1.8;
  }
  function clamp(){const {w,h}=bounds();camera.x=Math.min(w-65,Math.max(65-W*camera.scale,camera.x));camera.y=Math.min(h-60,Math.max(60-H*camera.scale,camera.y));}
  function reset(){closeDetails(false);const {w,h}=bounds();camera.scale=Math.max(.65,Math.min(1.1,(Math.min(w,580)-25)/W));camera.x=(w-W*camera.scale)/2;camera.y=Math.max(22,Math.min(45,(h-H*camera.scale)/2));paint();}
  function zoom(factor,cx=null,cy=null){const {w,h}=bounds();cx??=w/2;cy??=h/2;const next=Math.max(.65,Math.min(1.8,camera.scale*factor)),ratio=next/camera.scale;camera.x=cx-(cx-camera.x)*ratio;camera.y=cy-(cy-camera.y)*ratio;camera.scale=next;clamp();paint();}
  function visibleArea(){const {w,h}=bounds(),side=!panel.hidden&&w>=650;return {left:18,top:24,right:side?panel.offsetLeft-24:w-12,bottom:panel.hidden||side?h-68:Math.max(80,panel.offsetTop-18)};}
  function ensureVisible(point){
    if(point.kind==='dependency')return;const area=visibleArea(),px=camera.x+point.x*camera.scale,py=camera.y+point.y*camera.scale;
    if(px<area.left)camera.x+=area.left-px;if(px+145>area.right)camera.x-=px+145-area.right;
    if(py<area.top)camera.y+=area.top-py;if(py+22>area.bottom)camera.y-=py+22-area.bottom;paint();
  }
  function section(label,text,cls=''){const n=el('section','section '+cls);n.append(el('p','eyebrow',label));if(text)n.append(el('p','copy',text));return n;}
  function closeDetails(focus=true){panel.hidden=true;wrap.classList.remove('has-details');nodes.forEach(n=>{n.button.classList.remove('selected');n.button.setAttribute('aria-expanded','false');});edgeWorld.querySelector('.dependency')?.classList.remove('emphasis');if(focus&&returnFocus?.isConnected)returnFocus.focus({preventScroll:true});selected=null;}
  function stagePoint(id){return nodes.find(n=>n.kind==='stage'&&n.id===id);}
  function selectStage(id){show(stagePoint(id));}
  function lockBox(s){const requirement=byStage(s.requires),box=el('div','lock-box'),head=el('p','lock-title');head.append(icon('lock'),document.createTextNode('Этап пока закрыт'));box.append(head,el('p','','Откроется, когда ты дойдёшь до этапа «'+requirement.s.title+'» в блоке «'+requirement.b.name+'».'));
    box.append(button('Показать нужный этап','text-link',()=>selectStage(s.requires),'arrow'));return box;
  }
  function show(point){
    if(!point||point.kind==='dependency')return;selected=point;returnFocus=point.button;const {b,s,kind}=point;
    nodes.forEach(n=>{n.button.classList.toggle('selected',n===point);n.button.setAttribute('aria-expanded',String(n===point));});edgeWorld.querySelector('.dependency').classList.toggle('emphasis',s?.requires!==undefined||s?.id==='money-health');
    content.replaceChildren();panel.style.setProperty('--c',b.color);const header=el('div','details-head'),titles=el('div');titles.append(el('p','crumb',kind==='block'?'Блок времени':b.name+' · '+(kind==='goal'?'цель этапа':'этап '+(b.stages.indexOf(s)+1))));const h=el('h2','',kind==='block'?b.name:kind==='goal'?s.goals[0].title:s.title);h.id='detail-title';titles.append(h);const close=button('','close',()=>closeDetails(),'close');close.setAttribute('aria-label','Закрыть подробности');header.append(titles,close);content.append(header);
    if(kind==='block'){
      content.append(el('p','status','Три этапа · текущий и два будущих'));const list=el('ol','stage-list');b.stages.forEach((st,i)=>{const li=el('li'),row=button('',st.current?'current':'',()=>selectStage(st.id));row.append(el('span','list-dot'));const copy=el('span','',st.title);copy.append(el('small','',st.current?'Сейчас · этап '+(i+1):'Этап '+(i+1)+(st.requires?' · закрыт условием':'')));row.append(copy,icon('chevron'));li.append(row);list.append(li);});content.append(list);
    }else if(kind==='goal'){
      const state=el('p','status');state.append(el('span','status-dot'),document.createTextNode('Из этапа «'+s.title+'»'));content.append(state);if(s.requires)content.append(lockBox(s));content.append(button('Открыть весь этап','text-link',()=>selectStage(s.id),'arrow'));
    }else{
      const state=el('p','status');state.append(el('span','status-dot'),document.createTextNode(s.current?'Текущий этап':s.requires?'Будущий этап · есть условие':'Будущий этап'));content.append(state);if(s.requires)content.append(lockBox(s));
      content.append(section('Смысл этапа',s.meaning));for(const g of s.goals)content.append(section('Цель',g.title,'goal-copy'));
      const tasks=section('Задания этапа',null,'tasks');for(const t of s.tasks)tasks.append(el('p','task-row',t));content.append(tasks);
      if(s.id==='money-health'){const note=section('Связь с другим блоком','Достижение этого этапа открывает «Плановые чекапы» в физическом здоровье.');note.append(button('Показать зависимый этап','text-link',()=>selectStage('health-checkups'),'arrow'));content.append(note);}
    }
    content.append(el('p','read-only','Вымышленный пример. Сейчас проверяем только вид карты.'));panel.hidden=false;panel.scrollTop=0;wrap.classList.add('has-details');
    requestAnimationFrame(()=>ensureVisible(point));
    $('selection-status').textContent=(kind==='goal'?'Цель: ':kind==='block'?'Блок: ':'Этап: ')+(s?(kind==='goal'?s.goals[0].title:s.title):b.name);
  }
  $('jump-lock').append(icon('lock'),document.createTextNode('Связь блоков'));$('jump-lock').addEventListener('click',()=>selectStage('health-checkups'));
  for(const [id,glyph] of [['zoom-in','plus'],['zoom-out','minus'],['reset','reset']])$(id).append(icon(glyph));
  $('zoom-in').addEventListener('click',()=>zoom(1.22));$('zoom-out').addEventListener('click',()=>zoom(1/1.22));$('reset').addEventListener('click',reset);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!panel.hidden){e.preventDefault();closeDetails();}});
  // A small camera only: no stage editor, simulation, unlocking or progress changes.
  const pointers=new Map();let gesture=null;
  board.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;panMoved=false;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){gesture={x:e.clientX,y:e.clientY,startX:camera.x,startY:camera.y};}
    else if(pointers.size===2){const [a,b]=[...pointers.values()];gesture={distance:Math.hypot(a.x-b.x,a.y-b.y),scale:camera.scale,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,startX:camera.x,startY:camera.y};panMoved=true;}
  });
  board.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2&&gesture?.distance){const [a,b]=[...pointers.values()],r=board.getBoundingClientRect(),cx=(a.x+b.x)/2-r.left,cy=(a.y+b.y)/2-r.top,oldCx=gesture.cx-r.left,oldCy=gesture.cy-r.top;camera.scale=Math.max(.65,Math.min(1.8,gesture.scale*Math.hypot(a.x-b.x,a.y-b.y)/gesture.distance));const ratio=camera.scale/gesture.scale;camera.x=cx-(oldCx-gesture.startX)*ratio;camera.y=cy-(oldCy-gesture.startY)*ratio;panMoved=true;}
    else if(pointers.size===1&&gesture?.x!==undefined){const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(!panMoved&&Math.hypot(dx,dy)<6)return;panMoved=true;camera.x=gesture.startX+dx;camera.y=gesture.startY+dy;}
    if(panMoved){board.classList.add('dragging');clamp();paint();}
  });
  function finish(e){pointers.delete(e.pointerId);if(pointers.size===1){const a=[...pointers.values()][0];gesture={x:a.x,y:a.y,startX:camera.x,startY:camera.y};}else if(!pointers.size){gesture=null;board.classList.remove('dragging');}}
  window.addEventListener('pointerup',finish);window.addEventListener('pointercancel',finish);board.addEventListener('lostpointercapture',finish);
  board.addEventListener('wheel',e=>{e.preventDefault();const r=board.getBoundingClientRect();if(e.ctrlKey)zoom(Math.exp(-e.deltaY*.007),e.clientX-r.left,e.clientY-r.top);else{camera.x-=e.deltaX;camera.y-=e.deltaY;clamp();paint();}},{passive:false});
  board.addEventListener('keydown',e=>{if(e.target!==board)return;const move={ArrowDown:[0,-70],ArrowUp:[0,70],ArrowLeft:[70,0],ArrowRight:[-70,0]}[e.key];if(move){e.preventDefault();camera.x+=move[0];camera.y+=move[1];clamp();paint();}if(e.key==='+'||e.key==='=')zoom(1.22);if(e.key==='-')zoom(1/1.22);});
  new ResizeObserver(()=>{if(!selected)reset();else{paint();ensureVisible(selected);}}).observe(board);
  build();reset();
})();
