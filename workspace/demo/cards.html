blem svg{width:29px;height:29px}.emblem:after{content:"";position:absolute;bottom:-3px;width:20px;height:3px;background:var(--tone,var(--gold));border-radius:4px;opacity:.65}.head-copy{min-width:0;flex:1}.overline{font-size:9px;letter-spacing:1.4px;font-weight:750;color:#c0b2ad;margin:0 0 5px}.name{font-size:17px;line-height:1.35;font-weight:750;letter-spacing:-.25px;overflow-wrap:anywhere;margin:0}.tools{display:flex;gap:0;flex-shrink:0;margin:-8px -9px 0 0}.icon-button{display:grid;place-items:center;width:36px;height:40px;border:0;background:none;border-radius:8px;color:#b8bcaf}.icon-button svg{width:20px;height:20px}.icon-button[aria-pressed=true]{color:var(--gold)}.icon-button[aria-pressed=true] svg{fill:#ffda2925}.task-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:16px}.tag{color:var(--tone,var(--gold));border:1px solid color-mix(in srgb,var(--tone,var(--gold)) 30%,transparent);background:color-mix(in srgb,var(--tone,var(--gold)) 7%,transparent);padding:4px 8px;border-radius:8px;font-size:10px;font-weight:650}.muted{font-size:11px;color:var(--muted)}.reward{display:inline-flex;align-items:center;gap:5px;color:var(--gold);font-size:12px;line-height:1.3;font-weight:750;white-space:nowrap}.reward svg{width:16px;height:16px}.reward.pill{padding:5px 8px;border:1px solid #ffda2933;border-radius:8px;background:linear-gradient(135deg,#ffda2910,#ffda2903)}.task-meta .reward{margin-left:auto}.footer{display:flex;align-items:center;gap:12px;padding-top:14px;margin-top:16px;border-top:1px solid var(--line)}.check{display:flex;align-items:center;gap:7px;font-size:10px;color:#c2c7b6;min-height:40px;flex:1;cursor:pointer}.check input,.stage input{width:18px;height:18px;margin:0;accent-color:var(--gold);flex-shrink:0}.primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:43px;padding:9px 18px;border:1px solid #ffe88980;border-radius:11px;background:linear-gradient(165deg,#ffe168,#ffd52b 65%,#eabc1c);box-shadow:inset 0 1px 0 #ffffff60,0 3px 12px #ffda290b;color:#28220b;font-size:12px;font-weight:800;white-space:nowrap}.primary svg{width:16px;height:16px}.secondary{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:9px 12px;border:1px solid #ffffff16;border-radius:10px;background:#ffffff04;font-size:12px;color:#c6cbbd}.footer .primary{margin-left:auto}.progress-line{display:flex;gap:12px;align-items:center;margin-top:18px}.progress-number{font-size:16px;white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums}.progress-number small{color:var(--muted);font-size:12px;font-weight:500}.track{flex:1;height:7px;border-radius:20px;background:#aa777721;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,#e0ad14,#ffe561);box-shadow:0 0 15px #ffda2940;border-radius:20px;transition:width .25s}.quest-reward{display:flex;align-items:center;gap:10px;margin-top:13px}.counter-actions{display:flex;justify-content:space-between;gap:12px}.counter-actions .primary{min-width:118px}.stages{margin-top:18px;display:grid;gap:0}.stage{display:flex;gap:9px;align-items:center;min-height:45px;border-bottom:1px solid var(--line);font-size:12px;cursor:pointer}.stage input{accent-color:var(--green)}.stage-name{flex:1;min-width:0;overflow-wrap:anywhere}.stage .reward{font-size:10px;gap:3px}.stage .reward svg{width:13px}.stage.done .stage-name{color:#a9bca0}.final-reward{margin-top:14px;padding:11px 10px;border:1px solid #ffda2923;border-radius:10px;background:linear-gradient(100deg,#ffda2908,transparent);display:flex;align-items:center;gap:8px;font-size:10px;color:#c6c8b8}.final-reward>svg{color:var(--gold)}.final-reward .reward{margin-left:auto}.event{display:flex;align-items:center;gap:13px;padding:17px}.time{min-width:54px;color:var(--gold);font-size:20px;font-weight:800;letter-spacing:-.5px;line-height:1.1}.time small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:0;margin-top:7px}.event-copy{border-left:1px solid var(--line);padding-left:13px;flex:1;min-width:0}.event-copy .name{font-size:15px}.event-copy .muted{margin-top:4px;display:block}.event .primary{padding:9px 12px}.completed{display:flex;gap:12px;align-items:center;background:linear-gradient(140deg,#1d271a,#121710);border-color:#a4ce972b}.completed:before{background:var(--green)}.done-emblem{display:grid;place-items:center;border-radius:50%;width:40px;height:40px;flex-shrink:0;color:#172514;background:linear-gradient(150deg,#b4d9a3,#739668);box-shadow:0 0 0 4px #a4ce9710}.completed .name{font-size:14px;color:#cbd5c4}.completed .reward{margin-top:7px;font-size:11px}.completed .icon-button{margin-left:auto}.goal-footer .reward{color:var(--green)}.goal-footer .primary{background:linear-gradient(150deg,#526e3d,#2c4224);border-color:#a4ce9747;color:#e1edda}.status-badge{color:var(--green);border:1px solid #a4ce9740;background:#a4ce970b;padding:3px 7px;border-radius:6px;font-size:9px;letter-spacing:.8px;font-weight:800;display:inline-block;margin-top:10px}.goal-meaning{font-size:12px;color:#adbba3;margin-top:15px}.demo-note{font-size:11px;color:#8d9584;max-width:460px;margin:26px 0 0}.demo-note a{color:#b8c3ad;text-underline-offset:3px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:#10130ff5;border-top:1px solid #ffda2920;backdrop-filter:blur(14px);padding:9px 12px calc(9px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:7px}.bottom button{min-height:48px;padding:6px 15px;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:transparent;color:#a8b19c;border-radius:10px;font-size:11px}.bottom button.active{background:#ffda290b;color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}#toast{position:fixed;z-index:20;bottom:90px;left:50%;transform:translateX(-50%);background:#252b20;border:1px solid #ffda2950;border-radius:12px;padding:12px 18px;color:var(--gold);font-size:13px;box-shadow:0 8px 40px #0008;max-width:calc(100% - 32px);text-align:center;pointer-events:none}#toast[hidden]{display:none}.empty{padding:20px;border:1px dashed #ffffff20;border-radius:14px;font-size:12px;color:var(--muted)}dialog{background:#171c14;color:var(--text);border:1px solid #ffda2940;border-radius:18px;padding:24px;width:min(420px,calc(100% - 32px))}dialog::backdrop{background:#000a;backdrop-filter:blur(5px)}dialog h2{font-size:19px;margin:0 0 20px}dialog label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px}dialog input{width:100%;background:#0c100b;color:var(--text);border:1px solid #ffffff25;border-radius:10px;min-height:45px;padding:10px}dialog .footer{justify-content:flex-end}button:hover:not(:disabled){filter:brightness(1.12)}
@media(min-width:900px){.layout{grid-template-columns:1fr 1fr;gap:24px}.pane:not(.visible){display:block}.pane{padding:22px;border:1px solid #ffffff10;border-radius:22px;background:#ffffff01}.intro{margin:4px 0 30px}.bottom{gap:20px}}
@media(max-width:370px){main{padding-left:14px;padding-right:14px}.top{padding-left:14px;padding-right:14px}.card{padding:15px}.card-head{gap:9px}.emblem{width:43px;flex-basis:43px;height:48px}.name{font-size:15px}.tools{flex-direction:column;margin-top:-6px}.icon-button{height:27px;width:28px}.task-meta{gap:5px}.tag{font-size:9px;padding:4px 6px}.check{font-size:9px;gap:5px}.primary{padding:9px 12px}.footer{gap:8px}.stage{font-size:11px}.stage .reward{font-size:9px}.bottom button{padding:6px 10px;font-size:10px}.event{padding:15px;gap:10px}.time{font-size:18px;min-width:45px}.event-copy{padding-left:10px}.event-copy .name{font-size:13px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*:before,*:after{transition:none!important}}
</style>

<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="coin" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v5c0 4 16 4 16 0V6M4 11v5c0 4 16 4 16 0v-5"/></symbol>
<symbol id="diamond" viewBox="0 0 24 24"><path d="m3 9 4-5h10l4 5-9 12ZM3 9h18M7 4l5 17 5-17"/></symbol>
<symbol id="book" viewBox="0 0 24 24"><path d="M12 5C8 2 3 3 3 3v16s5-1 9 2c4-3 9-2 9-2V3s-5-1-9 2ZM12 5v16"/></symbol>
<symbol id="walk" viewBox="0 0 24 24"><circle cx="14" cy="4" r="2"/><path d="m10 22 3-7-3-4 2-4 4 4 4 1M5 22l4-8M5 11l3-3 4-1M13 15l5 7"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><path d="m12 2 3 6 7 1-5 5 1 8-6-4-6 4 1-8-5-5 7-1Z"/></symbol>
<symbol id="dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="undo" viewBox="0 0 24 24"><path d="M5 4v6h6M5 10a8 8 0 1 1 1 9"/></symbol>
<symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6M17 2v6M3 11h18"/></symbol>
<symbol id="layers" viewBox="0 0 24 24"><path d="m12 2 10 5-10 5L2 7ZM2 12l10 5 10-5M2 17l10 5 10-5"/></symbol>
<symbol id="laptop" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="13" rx="1"/><path d="m4 16-3 5h22l-3-5"/></symbol>
<symbol id="target" viewBox="0 0 24 24"><circle cx="11" cy="13" r="9"/><circle cx="11" cy="13" r="5"/><path d="m11 13 10-10M17 2v5h5"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><path d="M8 5h13M8 12h13M8 19h13M3 5h.01M3 12h.01M3 19h.01"/></symbol>
<symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1"/></symbol>
</defs></svg>
<header><div class="top"><div class="brand"><b>●</b>LIFE <span>/</span> GAME</div><div class="wallet" aria-label="Демонстрационный баланс"><span class="money" id="coins"></span><span class="money diamonds" id="diamonds"></span></div></div></header>
<main><div class="intro"><div class="eyebrow">Демо дизайна · 01</div><h1>Больше жизни.<br>В каждом действии.</h1><p>Попробуй выполнить задание, продвинуть квест или достичь цели.</p><div class="nav"><button data-jump="tasks">Задания</button><button data-jump="events">Календарь</button><button data-jump="quests">Квесты</button><button data-jump="goals">Цели</button><a class="app-link" href="../">К приложению</a></div></div><div class="layout"><section class="pane visible" id="day-pane" aria-label="Мой день"></section><section class="pane" id="quest-pane" aria-label="Квесты и цели"></section></div><p class="demo-note">Это демо: примеры и баланс можно менять. Обновление страницы возвращает исходные значения.</p></main>
<nav class="bottom" aria-label="Демо"><button data-view="day" class="active"></button><button data-view="quest"></button><button data-action="reset"></button></nav>
<div id="toast" role="status" hidden></div>
<dialog id="edit"><form id="edit-form"><h2>Название карточки</h2><label for="edit-name">Попробуй своё название</label><input id="edit-name" required maxlength="120"><div class="footer"><button type="button" class="secondary" id="cancel-edit">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);
const icon=n=>`<svg aria-hidden="true"><use href="#${n}"></use></svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({tasks:[{id:'read',name:'Прочитать 20 страниц',category:'Знания и опыт',schedule:'Разовое',reward:15,icon:'book',tone:'rose',done:false,planned:true,favorite:false},{id:'walk',name:'Вечерняя прогулка',category:'Здоровье',schedule:'Каждый день',reward:20,icon:'walk',tone:'green',done:false,planned:true,favorite:false}],event:{name:'Тренировка',done:false},counter:{name:'Прочитать 12 книг',value:4,favorite:false},project:{name:'Создать свой проект',stages:[true,false,false],favorite:false},goal:{name:'Свободно говорить по-английски',done:false},charge:true});
let state=fresh(),view='day',editing=null,timer;
const reward=(n,pill=false,diamond=false)=>`<span class="reward${pill?' pill':''}">${icon(diamond?'diamond':'coin')}${n} ${diamond?'алмазов':'монет'}</span>`;
const tools=(id,favorite)=>`<div class="tools"><button class="icon-button" data-action="favorite" data-id="${id}" aria-label="Избранное" aria-pressed="${favorite}">${icon('star')}</button><button class="icon-button" data-action="edit" data-id="${id}" aria-label="Изменить название">${icon('dots')}</button></div>`;
const heading=(id,label,ic,count='')=>`<h2 class="section-title" id="${id}">${icon(ic)}${label}<span class="count">${count}</span></h2>`;
function taskCard(t){return `<article class="card ${t.tone}"><div class="card-head"><div class="emblem">${icon(t.icon)}</div><div class="head-copy"><h3 class="name">${esc(t.name)}</h3></div>${tools(t.id,t.favorite)}</div><div class="task-meta"><span class="tag">${t.category}</span><span class="muted">${t.schedule}</span>${reward('+'+t.reward,true)}</div><div class="footer"><label class="check"><input type="checkbox" data-action="plan" data-id="${t.id}" ${t.planned?'checked':''}>В конструкторе</label><button class="primary" data-action="task" data-id="${t.id}">Выполнить</button></div></article>`;}
function completedCard(name,n,id){return `<article class="card completed"><span class="done-emblem">${icon('check')}</span><div class="head-copy"><h3 class="name">${esc(name)}</h3>${reward(n,true)}</div><button class="icon-button" data-action="undo-task" data-id="${id}" aria-label="Отменить выполнение">${icon('undo')}</button></article>`;}
function render(){
 const done=state.tasks.filter(t=>t.done),active=state.tasks.filter(t=>!t.done),q=state.counter,st=state.project.stages;
 const earned=done.reduce((a,t)=>a+t.reward,0)+(q.value===12?200:0)+(st[0]?0:-50)+(st[1]?100:0)+(st[2]?150:0)+(st.every(Boolean)?300:0)+(state.charge?0:-15);
 $('coins').innerHTML=icon('coin')+(1200+earned);$('diamonds').innerHTML=icon('diamond')+(25+(state.goal.done?25:0));
 $('day-pane').innerHTML=heading('tasks','ЗАДАНИЯ','list',active.length)+`<div class="stack">${active.map(taskCard).join('')||'<div class="empty">Все задания выполнены. Хороший день!</div>'}</div>`+heading('events','КАЛЕНДАРЬ','calendar',1)+`<article class="card slate event"><div class="time">18:30<small>Сегодня</small></div><div class="event-copy"><h3 class="name">${esc(state.event.name)}</h3><span class="muted">Время для себя</span></div><button class="${state.event.done?'secondary':'primary'}" data-action="event">${icon(state.event.done?'undo':'check')}${state.event.done?'Отмена':'Готово'}</button></article>`+heading('completed','ВЫПОЛНЕНО','check',done.length+(state.charge?1:0))+`<div class="stack">${state.charge?completedCard('Утренняя зарядка',15,'charge'):''}${done.map(t=>completedCard(t.name,t.reward,t.id)).join('')}${!state.charge&&!done.length?'<div class="empty">Здесь появятся выполненные задания.</div>':''}</div>`;
 $('quest-pane').innerHTML=heading('quests','КВЕСТЫ','layers',2)+`<div class="stack"><article class="card rose"><div class="card-head"><div class="emblem">${icon('layers')}</div><div class="head-copy"><p class="overline">КВЕСТ · СЧЁТЧИК</p><h3 class="name">${esc(q.name)}</h3></div>${tools('counter',q.favorite)}</div>${q.value===12?'<span class="status-badge">КВЕСТ ЗАВЕРШЁН</span>':''}<div class="progress-line"><span class="progress-number">${q.value} <small>/ 12</small></span><div class="track" role="progressbar" aria-label="Прогресс книг" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${q.value}"><i style="width:${q.value/12*100}%"></i></div></div><div class="quest-reward">${reward('+200',true)}<span class="muted">За завершение</span></div><div class="footer counter-actions"><button class="secondary" data-action="counter-minus" ${q.value<=4?'disabled':''}>${icon('undo')}Отменить шаг</button><button class="primary" data-action="counter-plus" ${q.value===12?'disabled':''}>${q.value===12?icon('check')+'Готово':'+1 книга'}</button></div></article><article class="card rose"><div class="card-head"><div class="emblem">${icon('laptop')}</div><div class="head-copy"><p class="overline">КВЕСТ · ЭТАПЫ</p><h3 class="name">${esc(state.project.name)}</h3></div>${tools('project',state.project.favorite)}</div><div class="stages">${['Сформулировать идею','Собрать прототип','Проверить на практике'].map((name,i)=>`<label class="stage${st[i]?' done':''}"><input type="checkbox" data-action="stage" data-id="${i}" ${st[i]?'checked':''}><span class="stage-name">${name}</span>${reward('+'+[50,100,150][i])}</label>`).join('')}</div><div class="final-reward">${icon(st.every(Boolean)?'check':'star')}<span>${st.every(Boolean)?'Проект завершён':'Финальная награда'}</span>${reward('+300',true)}</div></article></div>`+heading('goals','ЦЕЛЬ','target')+`<article class="card green"><div class="card-head"><div class="emblem">${icon('target')}</div><div class="head-copy"><p class="overline">ТО, К ЧЕМУ ТЫ ИДЁШЬ</p><h3 class="name">${esc(state.goal.name)}</h3></div></div><p class="goal-meaning">Свободнее общаться. Открывать больше мира.</p>${state.goal.done?'<span class="status-badge">ЦЕЛЬ ДОСТИГНУТА</span>':''}<div class="footer goal-footer">${reward(25,true,true)}<button class="primary" data-action="goal">${icon(state.goal.done?'undo':'check')}${state.goal.done?'Отменить':'Достигнута'}</button></div></article>`;
 $('day-pane').classList.toggle('visible',view==='day');$('quest-pane').classList.toggle('visible',view==='quest');
 document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view));});
}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(timer);timer=setTimeout(()=>$('toast').hidden=true,2300);}
function showView(next,target){view=next;render();requestAnimationFrame(()=>{if(target)$(target).scrollIntoView({block:'start'});else window.scrollTo({top:0,behavior:'smooth'});});}
function editable(id){return state.tasks.find(t=>t.id===id)||state[id];}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.view){showView(b.dataset.view);return;}
 if(b.dataset.jump){showView(['quests','goals'].includes(b.dataset.jump)?'quest':'day',b.dataset.jump);return;}
 const action=b.dataset.action,id=b.dataset.id;if(!action)return;
 if(action==='edit'){editing=id;$('edit-name').value=editable(id).name;$('edit').showModal();$('edit-name').focus();return;}
 if(action==='reset'){state=fresh();view='day';render();toast('Демо возвращено к началу');window.scrollTo({top:0,behavior:'smooth'});return;}
 if(action==='task'){const t=editable(id);if(t.done)return;t.done=true;toast('Сделано! +'+t.reward+' монет');}
 if(action==='undo-task'){if(id==='charge')state.charge=false;else editable(id).done=false;toast('Выполнение отменено');}
 if(action==='favorite')editable(id).favorite=!editable(id).favorite;
 if(action==='event'){state.event.done=!state.event.done;toast(state.event.done?'Тренировка отмечена':'Отметка снята');}
 if(action==='counter-plus'){state.counter.value=Math.min(12,state.counter.value+1);if(state.counter.value===12)toast('Квест завершён! +200 монет');}
 if(action==='counter-minus')state.counter.value=Math.max(4,state.counter.value-1);
 if(action==='goal'){state.goal.done=!state.goal.done;toast(state.goal.done?'Цель достигнута! +25 алмазов':'Достижение отменено');}
 render();
 if(action!=='task'&&action!=='undo-task'){const same=[...document.querySelectorAll('button[data-action]')].find(x=>x.dataset.action===action&&x.dataset.id===id);if(same&&!same.disabled)same.focus({preventScroll:true});}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.action==='plan')editable(t.dataset.id).planned=t.checked;if(t.dataset.action==='stage'){state.project.stages[Number(t.dataset.id)]=t.checked;render();toast(state.project.stages.every(Boolean)?'Проект завершён! Финальная награда +300':'Этап обновлён');const next=document.querySelector('[data-action="stage"][data-id="'+t.dataset.id+'"]');next?.focus({preventScroll:true});}});
$('cancel-edit').addEventListener('click',()=>$('edit').close());
$('edit-form').addEventListener('submit',e=>{e.preventDefault();const name=$('edit-name').value.trim();if(!name){$('edit-name').setCustomValidity('Введи название');$('edit-name').reportValidity();return;}editable(editing).name=name;$('edit').close();render();toast('Название обновлено');});
$('edit-name').addEventListener('input',()=>$('edit-name').setCustomValidity(''));
document.querySelector('[data-view="day"]').innerHTML=icon('sun')+'Мой день';document.querySelector('[data-view="quest"]').innerHTML=icon('layers')+'Квесты и цели';document.querySelector('[data-action="reset"]').innerHTML=icon('undo')+'Сброс демо';
render();
</script>
</body>
</html>
