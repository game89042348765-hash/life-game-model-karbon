<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LifeGame · Стратегия — оформление приложения</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* LifeGame dark world: один тёмный вид как в приложении. Слой: шаги демо сверху → экран → нижние листы */
:root{--bg:#090909;--panel:#171717;--panel2:#141414;--surface:linear-gradient(145deg,#1d1d1d,#151515);--edge:#ffffff24;--edge2:#ffffff14;--text:#f1f1f1;--muted:#b0b0b0;--dim:#6c6c6c;--accent:#ffd54a;--input:#0c0c0c;--goal:#8ed6a5;--cause:#f19aaa;--line:#2c2c2c;--shade:#000000aa;--ink:#141414;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:480px;height:100%;margin:auto;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* demo steps */
.stepper{flex:none;display:flex;gap:4px;padding-block:10px 8px;border-bottom:1px solid var(--edge2)}
.stepper button{flex:1;min-width:0;min-height:40px;border:0;background:none;border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:11px}
.stepper button i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1.5px solid #3a3a3a;display:grid;place-items:center;font-size:11px;font-weight:700}
.stepper button.done i{border-color:#555;background:#2a2a2a;color:var(--muted)}
.stepper button.on{color:var(--text)}
.stepper button.on i{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.view.v-card,.view.v-map{overflow:hidden;display:flex;flex-direction:column}
.scroll{padding-block:0 40px}

/* shared (из strategy-levels-map) */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.top small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);display:grid;place-items:center;flex:none}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.note{color:var(--muted);font-size:13px;margin:4px 0 12px}
.card{background:var(--surface);border:1px solid var(--edge);border-radius:16px;padding:14px;margin:10px 0}
.cardbtn{width:100%;text-align:left;display:block}
.blockrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:56px;background:none;border:0;padding:0}
.bdot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.blockrow .t{flex:1;min-width:0}
.blockrow .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.blockrow .t>span{color:var(--muted);font-size:12px}
.mini{display:flex;gap:4px;margin-top:6px;align-items:center}
.mini i{width:9px;height:9px;border-radius:50%;border:1.5px solid #666;display:block}
.mini i.past{background:#555;border-color:#555}
.mini i.cur{width:13px;height:13px}
.mini i.lock{border-style:dashed;opacity:.5}
.h2{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:20px 0 6px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--edge);background:var(--panel);padding:10px 14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.dash{width:100%;border-style:dashed;background:none;color:var(--muted)}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
label.f{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input[type=text],textarea,select{width:100%;background:var(--input);border:1px solid var(--edge);border-radius:12px;color:var(--text);font:inherit;padding:11px 12px;min-height:44px}
textarea{min-height:80px;resize:vertical}
.wiz-prog{display:flex;gap:6px;margin:6px 0 14px}
.wiz-prog i{flex:1;height:4px;border-radius:4px;background:#2a2a2a}
.wiz-prog i.on{background:var(--accent)}
.wiz h2{font-size:20px;margin:6px 0 4px;text-wrap:balance}
.skipall{display:block;width:100%;margin-top:18px;text-align:center;border:1px dashed var(--edge);border-radius:12px;background:none;padding:12px;color:var(--muted);min-height:44px}
.banner{border:1.5px solid var(--accent);background:linear-gradient(135deg,#2a2410,#151515 75%);border-radius:16px;padding:14px;margin:6px 0 12px}
.banner b{color:var(--accent);display:block;font-size:16px;margin-bottom:2px}
.banner p{margin:0 0 10px;color:#d9cfa7;font-size:13px}

/* levels page */
.lv{display:flex;gap:12px}
.lv .rail{width:22px;flex:none;display:flex;flex-direction:column;align-items:center}
.lv .rail .ln{flex:1;width:2px;background:#333}
.lv .rail .dt{width:16px;height:16px;border-radius:50%;border:2px solid #777;margin:20px 0 6px;flex:none;background:var(--bg)}
.lvs>.lv:first-child .rail .ln.up,.lvs>.lv:last-child .rail .ln.down{visibility:hidden}
.ins button{min-height:36px;border:1px dashed #3a3a3a;border-radius:99px;background:#0d0d0d;color:var(--muted);font-size:12px;padding:4px 12px}
.lv>.card{flex:1;min-width:0;margin:6px 0}
.lv.past .dt{background:#555;border-color:#555}
.lv.past .card{opacity:.7}
.lv.cur .dt{width:20px;height:20px}
.lv.cur .card{border-color:var(--c)}
.lv.lock .dt{border-style:dashed;opacity:.6}
.lv.lock .card{border-style:dashed;background:#111;color:var(--dim)}
.lvh{display:flex;align-items:center;gap:8px;justify-content:space-between}
.lvh b{font-size:15px;overflow-wrap:anywhere;min-width:0}
.lv p,.sheet p.tx{margin:6px 0 0;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.lv p.empty{color:var(--dim);font-style:italic}
p.cond{font-size:12px;color:var(--accent);font-style:normal}
p.cond.ok{color:var(--goal)}
.sec{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
.task{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;background:none;border:0;padding:4px 0}
.task .cb{width:22px;height:22px;border-radius:7px;border:2px solid #777;flex:none;display:grid;place-items:center;font-size:13px}
.task.done .cb{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.task.done span:last-child{text-decoration:line-through;color:var(--dim)}
.goal{display:flex;gap:8px;align-items:center;margin:4px 0;overflow-wrap:anywhere}
.goal:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.addline{display:flex;gap:8px;margin-top:6px}.addline input{flex:1;min-width:0}

/* block-of-time card (из strategy-block-card) */
.bc-bars{flex:none;display:flex;gap:5px;padding-block:10px 0}
.bc-bars i{flex:1;height:3px;border-radius:3px;background:#2a2a2a;transition:background .25s}
.bc-deck{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.bc-deck::-webkit-scrollbar{display:none}
.bc{flex:0 0 100%;scroll-snap-align:start;overflow-y:auto;padding-block:12px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.bc-head{display:flex;align-items:center;gap:10px;min-height:44px}
.bc-ico{width:30px;height:30px;border-radius:9px;background:var(--c);flex:none;display:grid;place-items:center;color:#0b0b0b;font-weight:800;font-size:14px}
.bc-head b{flex:1;font-size:15px;min-width:0}
.bc-head b span{color:var(--muted);font-weight:500}
.bc-nav{background:none;border:0;color:var(--dim);font-size:13px;min-height:44px;padding:0 4px}
.bc-here{margin:16px 0 6px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--c)}
.bc h1{font-size:30px;line-height:1.08;margin:0 0 10px;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere;text-wrap:balance}
.bc-why{color:var(--muted);font-size:14px;margin:0 0 14px;overflow-wrap:anywhere}
.bc-why b{color:var(--text);font-weight:600}
.bc-goal{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:-4px 0 12px}
.bc-goal:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.bc-task{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;margin:0 0 8px;padding:10px 14px;border-radius:14px;border:1px solid var(--edge);background:var(--panel2);text-align:left}
.bc-task .cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--c);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:#0b0b0b}
.bc-task span{flex:1;min-width:0;overflow-wrap:anywhere}
.bc-task.done .cb{background:var(--c)}
.bc-task.done span:last-child{color:var(--dim);text-decoration:line-through}
.bc-prog{font-size:12px;color:var(--dim);margin:2px 0 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bc-prog span{flex:1}
.bc-link{background:none;border:0;color:var(--muted);font-size:12px;min-height:36px;padding:0 6px;text-decoration:underline;text-decoration-color:#444;text-underline-offset:3px}
.bc-ahead{margin-top:auto;padding-top:22px}
.bc-lab{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--dim);margin:0 0 6px;display:flex;justify-content:space-between}
.bc-lab span{color:var(--c)}
.bc-steps{list-style:none;margin:0 0 10px;padding:0}
.bc-steps li button{display:flex;align-items:flex-start;gap:12px;width:100%;background:none;border:0;padding:7px 0;text-align:left;min-height:40px}
.bc-steps .rl{width:12px;flex:none;display:flex;flex-direction:column;align-items:center;align-self:stretch;padding-top:5px}
.bc-steps .rl i{width:10px;height:10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 70%,#555);background:var(--bg);flex:none}
.bc-steps .rl em{flex:1;width:0;border-left:2px dotted #333;margin-top:3px}
.bc-steps .t{flex:1;min-width:0}
.bc-steps .t b{display:block;font-weight:500;color:#d6d6d6;overflow-wrap:anywhere}
.bc-steps .t small{color:var(--dim);font-size:11px}
.bc-steps .t small.lk{color:var(--accent)}
.bc-steps .t p{margin:4px 0 0;color:var(--muted);font-size:13px}
.bc-opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--accent);background:linear-gradient(135deg,#2a2410,#151515 75%);text-align:left;min-height:64px}
.bc-opt div{flex:1;min-width:0}
.bc-opt small{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--accent)}
.bc-opt b{display:block;font-size:19px;font-weight:800;color:var(--accent);overflow-wrap:anywhere}
.bc-opt p{margin:4px 0 0;font-size:13px;color:#d9cfa7}
.bc-opt.reached{background:linear-gradient(135deg,#3a3010,#1a1a1a);box-shadow:0 0 0 3px #ffd54a22}
.bc-beyond{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 14px;border-radius:14px;border:1px dashed #2f2f2f;background:repeating-linear-gradient(135deg,#111 0 8px,#0d0d0d 8px 16px);color:var(--dim);font-size:13px}
.bc-beyond b{color:#8a8a8a;font-weight:600}
.bc-max{display:flex;align-items:center;gap:10px;margin-top:8px;padding:6px 14px;color:var(--dim);font-size:12px;opacity:.8}
.bc-max span{overflow-wrap:anywhere}
.empty-state{padding-block:40px;text-align:center;color:var(--muted)}

/* map (механика из lifegame_v3) */
.mapbox{flex:1;min-height:0;position:relative;background:radial-gradient(ellipse at 30% 20%,#161616,transparent 60%),radial-gradient(#ffffff0c 1px,transparent 1.2px) 0 0/28px 28px,#0b0b0b;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#map.grabbing{cursor:grabbing}
.nd{cursor:pointer}
.nd text{pointer-events:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.nd .kick{font-size:8.5px;font-weight:800;letter-spacing:.06em;text-anchor:middle}
.nd .nm{font-size:11px;font-weight:600;fill:#ececec;text-anchor:middle}
.nd.past .nm{fill:#8c8c8c}
.nd.lock .nm{fill:#7a7a7a}
.nd.unset{opacity:.55}
.ebadge rect{fill:#121212;stroke-width:1}
.ebadge text{font-size:8.5px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.mctl{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.zoombox{display:flex;flex-direction:column;border:1px solid var(--edge);border-radius:14px;background:#161616ee;overflow:hidden}
.zoombox button{width:44px;height:44px;border:0;background:none;font-size:18px;border-bottom:1px solid var(--edge2)}
.zoombox button:last-child{border-bottom:0}
.zoombox button.on{color:var(--accent)}
#mini{width:112px;height:80px;border:1px solid var(--edge);border-radius:12px;background:#111e;display:block;cursor:pointer}
.mbottom{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#0b0b0bee 40%)}
.mbottom .btn{background:#161616ee}
.mhint{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;right:70px;font-size:11px;color:var(--dim);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.lg{width:9px;height:9px;border-radius:50%;border:1.5px solid #888;display:inline-block}

/* sheet + toast */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#161616;border:1px solid var(--edge);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:86svh;overflow:auto;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 4px;font-size:18px;overflow-wrap:anywhere;text-wrap:balance}
.kick2{font-size:11px;font-weight:700;letter-spacing:.09em}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:44px;height:44px;border-radius:12px;border:2px solid transparent;background:none;display:grid;place-items:center}
.swatches button span{width:22px;height:22px;border-radius:50%;display:block}
.swatches button.on{border-color:var(--text)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{min-height:40px;border-radius:99px;border:1px solid var(--edge);background:#1d1d1d;padding:6px 14px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#242424;border:1px solid var(--edge);padding:12px 16px;border-radius:14px;z-index:30;max-width:calc(100% - 32px);font-size:14px;width:max-content}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<style id="lifegame-app-skin">

.skin-brand{font-size:11px;font-weight:750;letter-spacing:2px;white-space:nowrap;display:flex;align-items:center;gap:8px}.skin-brand i{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.skin-wallet{display:flex;align-items:center;gap:6px}.skin-wallet span{min-width:34px;padding:6px 9px;border:1px solid #ffd54a26;border-radius:10px;background:#ffd54a06;color:var(--accent);font-size:12px;font-weight:750;font-variant-numeric:tabular-nums;text-align:center}.skin-wallet span:last-child{color:#8ed6a5;background:#8ed6a506;border-color:#8ed6a526}.skin-demo{font-size:9px;color:var(--muted);letter-spacing:0;margin-left:5px;font-weight:400}
.stepper{gap:6px;padding-top:10px;padding-bottom:12px;border-bottom:0;background:var(--bg)}.stepper button{min-height:48px;flex-direction:row;gap:6px;padding:7px 5px;border:1px solid #ffd54a33;border-radius:12px;background:#ffd54a04;color:var(--accent);font-size:11px;font-weight:650}.stepper button i{width:16px;height:16px;font-size:9px;border-color:#ffd54a45;color:var(--accent);flex:none}.stepper button.done i{border-color:#ffd54a50;color:var(--accent);background:none}.stepper button.on{color:var(--accent);background:#ffd54a13;border-color:#ffd54a;box-shadow:inset 0 0 0 1px #ffd54a22}.stepper button.on i{background:var(--accent);border-color:var(--accent);color:#000}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}.scroll{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}.top{padding:7px 0 15px;gap:10px;align-items:flex-start}.top h1{font-size:23px;font-weight:800;letter-spacing:-.4px;line-height:1.2}.top h1 small{font-size:12px;line-height:1.5;margin-top:7px;font-weight:400;letter-spacing:0;color:var(--muted)}.top .iconbtn{margin-top:-5px}.top h1 .bdot{vertical-align:3px}.note{font-size:12px;line-height:1.5;margin-bottom:14px;color:var(--muted)}
.skin-icon{display:inline-block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}.skin-icon-tile{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;border:1px solid color-mix(in srgb,var(--icon-tone,var(--accent)) 22%,transparent);border-radius:14px;color:var(--icon-tone,var(--accent));background:color-mix(in srgb,var(--icon-tone,var(--accent)) 8%,transparent)}.skin-icon-tile .skin-icon{width:23px;height:23px}.skin-heading-icon{color:var(--accent);margin-right:7px;width:19px;height:19px}

 if(s==="past")return l.kind==="fact"?'<span class="tag">Исходный</span>':'<span class="tag">Пройден</span>';
 if(s==="cur")return'<span class="tag acc">Сейчас</span>';
 if(s==="lock")return'<span class="tag">🔒 после оптимального</span>';
 if(l.kind==="opt")return'<span class="tag acc">★ Оптимальный</span>';
 if(condLocked(l))return'<span class="tag acc">🔒 условие</span>';
 return'<span class="tag">Только описание</span>';
}
function advanceBlock(b){
 const nx=b.levels[b.cur+1];
 if(!nx)return"Это последний уровень блока";
 if(condLocked(nx)){const t=reqTarget(nx.req);return`Сначала дойди до «${t.l.name}» в блоке «${t.b.name}»`}
 return"";
}
function doAdvance(b){
 b.cur++;const l=b.levels[b.cur];
 if(l.kind==="opt"){b.levels.forEach(x=>{if(x.kind==="hidden"){x.kind="plan";x.name="Новый уровень"}if(x.kind==="unknown"){x.kind="plan";x.name="Следующий за оптимальным"}});toast("★ Оптимальный достигнут! Скрытые уровни открылись")}
 else toast("Теперь текущий этап: "+l.name);
}

/* ================= шаги демо ================= */
function stepIdx(){return Math.max(0,STEPS.findIndex(s=>s[0]===S.view))}
function stepperHTML(){const k=stepIdx();return`<nav class="stepper pad" aria-label="Шаги демо">${STEPS.map(([v,n],i)=>`<button data-step="${v}" class="${i===k?"on":i<k?"done":""}" ${i===k?'aria-current="step"':""}><i>${i+1}</i>${n}</button>`).join("")}</nav>`}
function goStep(v){
 if(v==="map")return;
 const setup=S.blocks.filter(b=>b.setup);
 if(v==="home"){S.view="home"}
 else if(v==="wiz"){if(S.wiz&&blk()){S.view="wiz"}else{const b=blk()&&!blk().setup?blk():S.blocks.find(x=>!x.setup)||blk()||S.blocks[0];startWiz(b);return}}
 else if(v==="block"){const b=blk()&&blk().setup?blk():setup[0];if(!b){toast("Сначала ответь на вопросы хотя бы одного блока");return}S.bid=b.id;S.view="block"}
 else S.view=v;
 render(true);
}

/* ================= 3. Итог: уровни блока ================= */
function levelCard(b,l,i){
 const s=status(b,i);let body="";
 if(s==="lock")body=l.kind==="max"&&l.text?`<p>${esc(l.text)}</p><p class="empty">Виден, но действия откроются после оптимального.</p>`:`<p class="empty">Скрыто. Откроется, когда достигнешь оптимального.</p>`;
 else if(s==="cur"){
  const why=advanceBlock(b);
  body=`${l.text?`<p>${esc(l.text)}</p>`:""}
  <div class="sec">Смысл</div>${l.meaning?`<p style="color:var(--text)">${esc(l.meaning)}</p>`:`<div class="addline"><input type="text" maxlength="120" placeholder="Зачем этот этап" aria-label="Смысл"><button class="btn" data-act="addMeaning" aria-label="Добавить смысл">＋</button></div>`}
  <div class="sec">Цели</div>${l.goals.map(g=>`<div class="goal">${esc(g.name)}</div>`).join("")}
  <div class="addline"><input type="text" maxlength="120" placeholder="Новая цель" aria-label="Новая цель"><button class="btn" data-act="addGoal" aria-label="Добавить цель">＋</button></div>
  <div class="sec">Задания</div>${l.tasks.map(t=>`<button class="task ${t.done?"done":""}" data-task="${t.id}" aria-pressed="${t.done}"><span class="cb">${t.done?"✓":""}</span><span>${esc(t.name)}</span></button>`).join("")}
  <div class="addline"><input type="text" maxlength="120" placeholder="Новое задание" aria-label="Новое задание"><button class="btn" data-act="addTask" aria-label="Добавить задание">＋</button></div>
  ${i<b.levels.length-1?`<button class="btn wide" style="margin-top:12px;${why?"opacity:.6":""}" data-act="advance">${why?"🔒 ":""}Этап пройден → следующий</button>`:""}`;
 }else{
  body=l.text?`<p>${esc(l.text)}</p>`:`<p class="empty">${l.kind==="fact"&&b.mode==="short"?"Не описан":"Не описан · нажми, чтобы описать"}</p>`;
  if(l.req&&reqTarget(l.req))body+=`<p class="cond ${reqMet(l.req)?"ok":""}">${esc(condText(l))}</p>`;
  if(s==="plan")body+=`<p class="empty" style="font-size:12px">Здесь можно только описать. Цели и задания — когда этап станет текущим.</p>`;
 }
 const tap=s==="plan"||(s==="past"&&l.kind==="fact")||s==="lock";
 const inner=`<div class="lvh"><b>${esc(l.name)}</b>${statusTag(b,i)}</div>${body}`;
 return`<div class="lv ${s}" id="lv${i}" style="--c:${b.color}"><div class="rail"><div class="ln up"></div><div class="dt" style="${s==="cur"?`background:${b.color};border-color:${b.color}`:l.kind==="opt"?"border-color:var(--accent)":""}"></div><div class="ln down"></div></div>
  ${tap?`<button class="card cardbtn" data-lv="${i}">${inner}</button>`:`<div class="card">${inner}</div>`}</div>`;
}
function canInsert(b,pos){
 const o=optIdx(b),prev=b.levels[pos-1],nx=b.levels[pos];if(!prev||!nx||pos<=b.cur)return false;
 if(b.cur>=o)return pos>o;
 const pre=b.levels.findIndex(l=>l.kind==="pre");
 return pos<=(pre>=0?pre:o);
}
function insHTML(b,pos){return canInsert(b,pos)?`<div class="ins"><button data-act="ins" data-at="${pos}">＋ этап</button></div>`:""}

 return out;
}

  h=`${head}<h3>${esc(s==="lock"&&l.kind!=="max"?"Скрытые уровни":l.name)}</h3><p class="note"><span class="bdot" style="width:8px;height:8px;background:${b.color}"></span> ${esc(b.name)}</p>`;
  if(s==="lock")h+=`<p class="tx">${l.kind==="max"&&l.text?esc(l.text)+"\n\n":""}Откроется, когда достигнешь оптимального.</p>`;
  else if(s==="cur"){const why=advanceBlock(b);h+=`${l.meaning?`<div class="sec">Смысл</div><p class="tx" style="color:var(--text)">${esc(l.meaning)}</p>`:""}${l.goals.length?`<div class="sec">Цели</div>${l.goals.map(g=>`<div class="goal">${esc(g.name)}</div>`).join("")}`:""}<div class="sec">Задания</div>${taskBtns(b,l,id)||'<p class="note">Заданий нет</p>'}
   ${b.cur<b.levels.length-1?`<button class="btn wide" style="margin-top:12px;${why?"opacity:.6":""}" data-act="madv" data-b="${b.id}">${why?"🔒 ":""}Этап пройден → следующий</button>`:""}`}
  else{h+=`<p class="tx">${esc(l.text||(s==="past"?"Этап пройден.":"Пока не описан."))}</p>`;if(l.req&&reqTarget(l.req))h+=`<p class="cond ${reqMet(l.req)?"ok":""}" style="margin-top:10px">${esc(condText(l))}</p>`;if(s==="plan")h+=`<p class="note" style="margin-top:10px">Пока только описание. Цели и задания появятся, когда этап станет текущим.</p>`}
  h+=`<div class="row" style="margin-top:14px"><button class="btn" data-act="sclose">Закрыть</button><button class="btn pri" data-act="goto" data-b="${b.id}" data-i="${n.li}">Открыть в блоке</button></div>`;
 }
 openSheet(h);
}

/* ================= рендер ================= */
function render(nav){
 if(S.view==="map")S.view=blk()&&blk().setup?"card":"home";
 const a=$("#app"),pv=S._rv,v=$(".view");
 const keepY=!nav&&v&&pv===S.view?v.scrollTop:0;
 let deck=null;if(S.view==="card"&&pv==="card"&&!nav){const d=$("#deck");if(d)deck={x:d.scrollLeft,y:[...d.children].map(c=>c.scrollTop)}}
 if(S.view!=="block"&&S.view!=="card")S.justDone=null;
 const body=S.view==="home"?homeHTML():S.view==="wiz"?wizHTML():S.view==="block"?blockHTML():S.view==="card"?cardHTML():mapHTML();
 a.innerHTML=skinHeader()+stepperHTML()+`<main class="view v-${S.view}">${body}</main>`;
 const nv=$(".view");if(nv)nv.scrollTop=keepY;
 if(S.view==="card"){const d=$("#deck");if(d){if(deck){d.scrollLeft=deck.x;[...d.children].forEach((c,i)=>c.scrollTop=deck.y[i]||0)}else{const i=Math.max(0,setupList().findIndex(b=>b.id===S.bid));d.scrollLeft=i*d.clientWidth}d.addEventListener("scroll",()=>requestAnimationFrame(bars),{passive:true});bars()}}
 if(S.view==="map"){drawMap();bindMap()}
 skinPresent();
 S._rv=S.view;save();
}
function openSheet(html){const o=$(".shade");if(o)o.remove();const sh=document.createElement("div");sh.className="shade";sh.innerHTML=`<div class="sheet pad" role="dialog" aria-modal="true">${html}</div>`;sh.addEventListener("click",e=>{if(e.target===sh)closeSheet()});document.body.appendChild(sh);const f=sh.querySelector("input[type=text],textarea");if(f)f.focus()}
function closeSheet(){const s=$(".shade");if(s)s.remove();if(S.map.sel){S.map.sel=null;if(S.view==="map")drawMap()}}
function openBlock(id){const b=byId(id);if(b.setup){S.bid=b.id;S.view="block";render(true)}else startWiz(b)}
let newColor=COLORS[0],newEx=null;
function newBlockSheet(){
 openSheet(`<h3>Новый блок</h3><p class="note">Своё направление времени. Стратегия у него та же: факт → … → максимум.</p>
 <div class="sec">Быстрый пример</div><div class="chips">${PRESETS.map(([k,n])=>`<button data-preset="${k}">${esc(n)}</button>`).join("")}</div>
 <label class="f" for="nb_n">Название</label><input type="text" id="nb_n" maxlength="120" placeholder="Например: Гитара">
 <div class="sec">Цвет</div><div class="swatches">${COLORS.map(c=>`<button data-color="${c}" class="${c===newColor?"on":""}" aria-label="Цвет ${c}"><span style="background:${c}"></span></button>`).join("")}</div>
 <div class="row" style="margin-top:16px"><button class="btn" data-act="sclose">Отмена</button><button class="btn pri" data-act="nbsave">Создать и ответить на вопросы</button></div>`);
}
function reqOptions(b,l){
 const cur=l.req?l.req.bid+"|"+l.req.lid:"";
 let o=`<option value="">Без условия</option>`;
 setupList().filter(x=>x.id!==b.id).forEach(x=>{o+=`<optgroup label="${esc(x.name)}">`+x.levels.filter(y=>y.kind!=="fact"&&y.kind!=="hidden"&&y.kind!=="unknown"&&y.kind!=="max").map(y=>`<option value="${x.id}|${y.id}" ${cur===x.id+"|"+y.id?"selected":""}>${esc(y.name)}</option>`).join("")+`</optgroup>`});
 return o;
}

/* ================= события ================= */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-step],[data-open],[data-act],[data-lv],[data-task],[data-preset],[data-color],[data-go],[data-bt],[data-s]");if(!t)return;
 if(t.dataset.act==="tomap")return;
 const b=blk();
 if(t.dataset.act==="sclose"){closeSheet();if(t.dataset.step)goStep(t.dataset.step);return}
 if(t.dataset.step){closeSheet();goStep(t.dataset.step);return}
 if(t.dataset.open){closeSheet();openBlock(t.dataset.open);return}
 if(t.dataset.preset){const p=PRESETS.find(x=>x[0]===t.dataset.preset);$("#nb_n").value=p[1];newEx=p[0];newColor=p[2];document.querySelectorAll("[data-color]").forEach(x=>x.classList.toggle("on",x.dataset.color===newColor));return}
 if(t.dataset.color){newColor=t.dataset.color;document.querySelectorAll("[data-color]").forEach(x=>x.classList.toggle("on",x===t));return}
 if(t.dataset.go!==undefined){const d=$("#deck");d.scrollTo({left:+t.dataset.go*d.clientWidth,behavior:"smooth"});return}
 if(t.dataset.bt){const[bid,tid]=t.dataset.bt.split("|"),x=byId(bid),tk=x.levels[x.cur].tasks.find(q=>q.id===tid);tk.done=!tk.done;render();return}
 if(t.dataset.s){const id=t.dataset.s;openSteps.has(id)?openSteps.delete(id):openSteps.add(id);render();return}
 if(t.dataset.task){const l=b.levels[b.cur],tk=l.tasks.find(x=>x.id===t.dataset.task);tk.done=!tk.done;render();return}
 if(t.dataset.lv!==undefined){
  const i=+t.dataset.lv,l=b.levels[i],s=status(b,i);
  if(s==="lock"){toast("Этот уровень откроется, когда достигнешь оптимального");return}
  const canReq=s==="plan"&&l.kind!=="opt"&&setupList().length>1;
  openSheet(`<h3>${esc(l.name)}</h3><p class="note">${l.kind==="fact"?"Исходная точка. Можно только описать.":"Только описание. Действия появятся, когда этап станет текущим."}</p>
   ${l.kind!=="fact"?`<label class="f" for="s_n">Название${l.kind==="opt"?" (обязательно)":""}</label><input type="text" id="s_n" maxlength="120" value="${esc(l.name)}">`:""}
   <label class="f" for="s_t">Описание</label><textarea id="s_t">${esc(l.text)}</textarea>
   ${canReq?`<label class="f" for="s_req">Закрыть условием: сначала дойти до этапа в другом блоке</label><select id="s_req">${reqOptions(b,l)}</select>`:""}
   <div class="row" style="margin-top:14px">${l.added?`<button class="btn ghost" data-act="sdel" data-i="${i}">Убрать</button>`:""}<button class="btn" data-act="sclose">Отмена</button><button class="btn pri" data-act="ssave" data-i="${i}">Сохранить</button></div>`);
  return;
 }
 const act=t.dataset.act;
 if(act==="home"){S.view="home";S.wiz=null;render(true)}
 else if(act==="tocard"){closeSheet();S.bid=t.dataset.b;S.view="card";render(true)}
 else if(act==="tolevels"){closeSheet();S.bid=t.dataset.b;S.view="block";render(true)}
 else if(act==="tomap"){closeSheet();S.map.focus="b:"+t.dataset.b;S.view="map";render(true)}
 else if(act==="wizfor"){closeSheet();startWiz(byId(t.dataset.b))}
 else if(act==="goto"){closeSheet();S.bid=t.dataset.b;S.view="block";render(true);const el=document.getElementById("lv"+t.dataset.i);if(el)el.scrollIntoView({block:"center"})}
 else if(act==="ins"){const pos=+t.dataset.at,after=b.cur>=optIdx(b);openSheet(`<h3>Новый этап</h3><p class="note">Встанет между «${esc(b.levels[pos-1].name)}» и «${esc(b.levels[pos].name)}». ${after?"Это уровень после оптимального.":"Пока можно только описать — действия появятся, когда этап станет текущим."}</p><label class="f" for="s_n">Название</label><input type="text" id="s_n" maxlength="120"><label class="f" for="s_t">Как это выглядит (по желанию)</label><textarea id="s_t"></textarea><div class="row" style="margin-top:14px"><button class="btn" data-act="sclose">Отмена</button><button class="btn pri" data-act="insgo" data-at="${pos}">Добавить</button></div>`)}
 else if(act==="insgo"){const n=$("#s_n").value.trim();if(!n){toast("Назови этап");return}b.levels.splice(+t.dataset.at,0,lvl("plan",n,$("#s_t").value.trim(),0,{added:true}));closeSheet();render();toast("Этап добавлен")}
 else if(act==="sdel"){b.levels.splice(+t.dataset.i,1);closeSheet();render()}
 else if(act==="ssave"){const l=b.levels[+t.dataset.i],n=$("#s_n");if(n){const v=n.value.trim();if(!v&&l.kind==="opt"){toast("У оптимального уровня нужно название");return}if(v)l.name=v}l.text=$("#s_t").value.trim();const r=$("#s_req");if(r){const[bid,lid]=r.value.split("|");l.req=r.value?{bid,lid}:null}closeSheet();render()}
 else if(act==="zin"||act==="zout"){const{W,H}=size();zoomAt(S.map.k*(act==="zin"?1.25:.8),W/2,H/2)}
 else if(act==="drag"){S.map.unlocked=!S.map.unlocked;render();toast(S.map.unlocked?"Круги можно перетаскивать":"Круги закреплены — палец двигает карту")}
 else if(act==="tidy"){S.map.pos={};render();toast("Круги вернулись на места")}
 else if(act==="me"){focusNode("me",.85)}
 else if(act==="overview"){overview(false)}
 else if(act==="mtask"){const x=byId(t.dataset.b),tk=x.levels[x.cur].tasks.find(q=>q.id===t.dataset.t);tk.done=!tk.done;save();nodeSheet(t.dataset.n)}
 else if(act==="madv"){const x=byId(t.dataset.b),why=advanceBlock(x);if(why){toast(why);return}closeSheet();doAdvance(x);render()}
 else if(act==="fillall"){
  S.blocks.filter(x=>!x.custom&&!x.setup).forEach(x=>build(x,exData(x.ex),false));
  [["b3",2],["b5",2],["b7",3]].forEach(([id,c])=>{const x=byId(id);if(x.mode==="full"&&x.cur<c&&x.cur===1){x.levels[c].tasks=x.levels[1].tasks.map(q=>({...q,id:nid(),done:false}));x.levels[c].meaning=x.levels[1].meaning;x.levels[c].goals=x.levels[1].goals.map(g=>({...g,id:nid()}));x.levels[1].goals=[];x.cur=c}});
  const link=(fb,fk,tb,ti)=>{const f=byId(fb),tt=byId(tb);if(!f.setup||!tt.setup||f.mode!=="full"||tt.mode!=="full")return;const l=f.levels.find(q=>q.kind===fk);if(l&&!l.req)l.req={bid:tb,lid:tt.levels[ti].id}};
  link("b1","pre","b3",2);link("b4","pre","b5",3);
  render();toast("Блоки заполнены примером — загляни на Карту")}
 else if(act==="newblock"){newColor=COLORS[0];newEx=null;newBlockSheet()}
 else if(act==="nbsave"){const n=$("#nb_n").value.trim();if(!n){toast("Назови блок");return}const nb=mk(nid(),n,newColor,true,newEx&&PRESETS.find(p=>p[0]===newEx)[1]===n?newEx:null);S.blocks.push(nb);closeSheet();startWiz(nb)}
 else if(act==="wnext"){readWiz();const steps=S.wiz.short?SHORT:FULL,st=steps[S.wiz.step];if(st.req&&!S.wiz.d[st.req]){toast("Нужно название оптимального уровня");return}if(S.wiz.step===steps.length-1)finishWiz();else{S.wiz.step++;render(true)}}
 else if(act==="wskip"){readWiz();const steps=S.wiz.short?SHORT:FULL;steps[S.wiz.step].f.forEach(([k])=>S.wiz.d[k]="");if(S.wiz.step===steps.length-1)finishWiz();else{S.wiz.step++;render(true)}}
 else if(act==="wprev"){readWiz();S.wiz.step--;render(true)}
 else if(act==="wshort"){readWiz();S.wiz.short=true;S.wiz.step=0;render(true)}
 else if(act==="wexample"){Object.assign(S.wiz.d,exData(b.ex));render(true)}
 else if(act==="reset"){openSheet(`<h3>Ответить заново?</h3><p class="note">Уровни, цели и задания блока «${esc(b.name)}» заменятся новыми ответами.</p><div class="row"><button class="btn" data-act="sclose">Отмена</button><button class="btn pri" data-act="resetgo">Начать заново</button></div>`)}
 else if(act==="resetgo"){closeSheet();b.setup=false;b.levels=[];startWiz(b)}
 else if(act==="resetall"){openSheet(`<h3>Сбросить демо?</h3><p class="note">Все блоки вернутся в состояние «не настроен».</p><div class="row"><button class="btn" data-act="sclose">Отмена</button><button class="btn pri" data-act="resetallgo">Сбросить</button></div>`)}
 else if(act==="resetallgo"){closeSheet();S=fresh();uid=1;render(true)}
 else if(["addMeaning","addGoal","addTask"].includes(act)){const v=t.parentElement.querySelector("input").value.trim();if(!v)return;const l=b.levels[b.cur];if(act==="addMeaning")l.meaning=v;else if(act==="addGoal")l.goals.push({id:nid(),name:v});else l.tasks.push({id:nid(),name:v,done:false});render()}
 else if(act==="advance"){const why=advanceBlock(b);if(why){toast(why);return}const next=b.levels[b.cur+1];openSheet(`<h3>Этап пройден?</h3><p class="note">Текущий этап станет пройденным. «${esc(next.name)}» станет текущим — в нём можно будет добавлять смысл, цели и задания.</p><div class="row"><button class="btn" data-act="sclose">Отмена</button><button class="btn pri" data-act="advgo">Перейти</button></div>`)}
 else if(act==="advgo"){closeSheet();doAdvance(b);render()}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeSheet();
 if(e.key==="Enter"&&e.target.matches(".addline input")){e.preventDefault();e.target.parentElement.querySelector("button").click()}
 if(S.view==="card"&&!$(".shade")){const d=$("#deck");if(d&&e.key==="ArrowRight")d.scrollBy({left:d.clientWidth,behavior:"smooth"});if(d&&e.key==="ArrowLeft")d.scrollBy({left:-d.clientWidth,behavior:"smooth"})}
});
window.addEventListener("resize",()=>{if(S.view==="map")applyT()});
render(true);
})();
</script>
</body>
