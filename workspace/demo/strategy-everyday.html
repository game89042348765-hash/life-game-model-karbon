<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121315"><title>LifeGame — маленький шаг к своей жизни</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#121315;color:#f0efe9;--muted:#a3a6ab;--edge:#36393d;--gold:#f5d667}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit;min-height:44px;border:1px solid var(--edge);border-radius:13px;background:#25272a;padding:10px 14px}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.shell{max-width:490px;margin:auto;padding:20px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:10px;letter-spacing:2px;font-weight:700}.brand:before{content:'●';color:var(--gold);margin-right:8px}.demo{font-size:10px;color:var(--muted)}h1{font-size:28px;letter-spacing:-.7px;margin:26px 0 8px}h2{font-size:20px;line-height:1.3;margin:6px 0 12px}h3{font-size:15px;margin:0 0 8px}p{line-height:1.5}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:7px;margin:23px 0}.tabs button{flex:1;background:none}.tabs button[aria-pressed=true]{color:var(--gold);border-color:#78683b;background:#28251d}.card{padding:20px;background:#202225;border:1px solid var(--edge);border-radius:22px;margin:14px 0}.kicker{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}.tag{font-size:11px;color:#9ed3b1}.primary{background:var(--gold);color:#181811;border-color:var(--gold);font-weight:700}.full{width:100%;margin-top:12px}.text{background:none;border:0;color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.actions{display:flex;gap:8px;margin-top:16px}.actions>*{flex:1}.habit{display:flex;align-items:center;gap:12px;min-height:58px;border-top:1px solid var(--edge);padding:9px 0;font-size:14px;line-height:1.4}.habit input{width:22px;height:22px;flex:none;accent-color:var(--gold)}.habit span{overflow-wrap:anywhere}.habit.done span{text-decoration:line-through;color:var(--muted)}.note{color:#b9c1b9;font-size:12px;margin:14px 0 0;line-height:1.5}.line{border-top:1px solid var(--edge);padding-top:16px;margin-top:17px}.map{margin:20px 0;background:#1b1d1f;border:1px solid var(--edge);border-radius:20px;padding:16px 12px}.lane{padding:10px 0 17px}.lane+.lane{border-top:1px solid var(--edge)}.lane-title{font-size:13px;display:flex;justify-content:space-between;gap:8px;margin-bottom:9px}.lane-title small{font-size:10px;color:var(--muted)}.dots{display:flex;align-items:center;gap:0;overflow-x:auto}.dots button{flex:1;min-width:44px;padding:7px 0;position:relative;border:0;background:none;border-radius:9px;display:grid;place-items:center;gap:8px;min-height:64px;color:var(--c)}.dots button:before{content:'';position:absolute;left:0;right:0;top:19px;border-top:1px solid var(--c);opacity:.35}.dots i{display:block;position:relative;width:11px;height:11px;background:#1b1d1f;border:1.5px solid var(--c);border-radius:50%}.dots .now i{background:var(--c);box-shadow:0 0 0 5px #ffffff10}.dots .locked i{border-style:dashed;border-color:var(--gold)}.dots small{font-size:9px;color:var(--muted)}.dots .now small{color:var(--gold)}.purpose{border-left:2px solid #727d70;padding-left:12px;font-size:13px;color:#bdc9be}.footer{margin-top:28px;color:#7f858c;font-size:11px;line-height:1.5}.feedback{color:#b5dbbf;font-size:13px;min-height:20px;margin:12px 0}dialog{width:min(460px,calc(100% - 20px));max-height:calc(100dvh - 24px);padding:0;border:1px solid #484c51;border-radius:22px;background:#202225;color:#f0efe9;overflow:auto}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}.sheet-head{position:sticky;top:0;padding:16px 18px 10px;background:#202225;z-index:1;display:flex;justify-content:space-between;gap:10px;align-items:center}.sheet-head h2{margin:0;font-size:20px}.close{padding:8px 13px;flex:none}.sheet-body{padding:4px 18px 22px}.savebar{position:sticky;bottom:0;display:flex;gap:8px;background:#202225;padding:12px 18px;border-top:1px solid var(--edge)}.savebar button{flex:1}label.field{display:block;font-size:12px;color:var(--muted);margin:16px 0 7px}input[type=text],textarea,select{display:block;width:100%;min-width:0;border:1px solid #45494e;border-radius:12px;background:#141618;color:#eeede8;padding:12px;font-size:16px;min-height:46px}textarea{min-height:90px;resize:vertical}details{border-top:1px solid var(--edge);margin-top:18px}summary{padding:16px 0;font-size:13px;color:var(--muted);cursor:pointer}.lockbox{border:1px solid #675637;border-radius:15px;padding:14px;background:#29251e;font-size:13px;line-height:1.5}.lockbox b{display:block;color:var(--gold);margin-bottom:7px}.section-title{font-size:11px;color:var(--muted);margin:22px 0 8px}.error{color:#e9b1a8;font-size:12px}.saved{color:#a6d4b4}.plain-list{padding-left:18px;font-size:14px;line-height:1.7}.empty{padding:15px 0;color:var(--muted);font-size:13px}@media(max-width:350px){.shell{padding:16px 13px 30px}.card{padding:16px}.dots small{font-size:8px}.lane-title{font-size:12px}}
</style></head><body><div class="shell"><div class="top"><span class="brand">LIFE / GAME</span><span class="demo">АЛЕКСЕЙ · ДЕМО</span></div><main id="app"></main><div class="footer">Вымышленный день. Можно нажимать и менять решения.<br>Обновление страницы возвращает пример к началу.<button class="text" id="reset">Начать заново</button></div></div><dialog id="sheet" aria-labelledby="sheet-title"></dialog><script>
'use strict';(()=>{
const $=id=>document.getElementById(id),app=$('app'),sheet=$('sheet');let tab='today',serial=0,message='';
const blocks=[{id:'health',name:'Здоровье',color:'#96cba6',why:'Хочу иметь силы на себя и семью.',current:0,stages:[{name:'Начать без перегруза',why:'Мне важно начать с того, что по силам.',goals:['Найти посильный ритм'],tasks:[]},{name:'Сохранить ритм',why:'Хочу продолжать без постоянных усилий над собой.',goals:['Найти удобное место для движения в дне'],tasks:[{id:'routine',name:'Выбрать время для движения',done:false}]},{name:'Плановая забота',why:'Хочу заранее решать вопросы о здоровье.',goals:['Подготовить выбранное платное обследование'],tasks:[{id:'clinic',name:'Уточнить стоимость и варианты',done:false}],gate:true},{name:'Больше энергии',goals:['Найти приятную активность'],tasks:[]},{name:'Активная жизнь',goals:['Поддерживать здоровье в своём ритме'],tasks:[]}]},{id:'money',name:'Ресурсы',color:'#99bce9',why:'Хочу меньше тревожиться из-за денег.',current:1,stages:[{name:'Понять положение',goals:['Увидеть обязательные расходы'],tasks:[]},{name:'Резерв на здоровье',goals:['Подтвердить, что деньги на выбранный вариант готовы'],tasks:[]},{name:'Устойчивый доход',goals:['Сделать доход предсказуемее'],tasks:[]},{name:'Запас и свобода',goals:['Подготовить семейную поездку без долга'],tasks:[]}]},{id:'family',name:'Семья',color:'#c5a7de',why:'Хочу быть рядом с близкими.',current:0,stages:[{name:'Восстановить контакт',goals:['Найти время на спокойное общение'],tasks:[]},{name:'Общие договорённости',goals:['Договориться о помощи и быте'],tasks:[]},{name:'Время вместе',goals:['Найти общее занятие без расходов'],tasks:[]},{name:'Общие планы',goals:['Выбрать семейную мечту'],tasks:[]}]}];
let habits=[{id:'walk',name:'Пройтись пять минут',done:false},{id:'sleep',name:'Выбрать время отхода ко сну',done:false}],reserve=false;
const el=(tag,cls='',text)=>{const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n;};
const btn=(text,cls,run)=>{const b=el('button',cls,text);b.type='button';b.addEventListener('click',run);return b;};
const title=(text,note)=>{const h=el('header');h.append(el('h1','',text),el('p','muted',note));return h;};
const locked=s=>s.gate&&!reserve;const health=()=>blocks[0];
function close(){sheet.close();}function open(name,build){sheet.replaceChildren();const h=el('div','sheet-head'),t=el('h2','',name);t.id='sheet-title';const x=btn('×','close',close);x.setAttribute('aria-label','Закрыть');h.append(t,x);const body=el('div','sheet-body'),bar=el('div','savebar');sheet.append(h,body);build(body,bar);if(bar.childElementCount)sheet.append(bar);if(!sheet.open)sheet.showModal();sheet.scrollTop=0;}
function task(t,edit=true){const label=el('label','habit'+(t.done?' done':'')),input=el('input');input.type='checkbox';input.checked=t.done;input.disabled=!edit;input.setAttribute('aria-label',t.name);input.addEventListener('change',()=>{t.done=input.checked;message=t.done?'Маленький шаг сделан. Можно остановиться на этом.':'';render();});label.append(input,el('span','',t.name));return label;}
function today(){app.append(title('Сегодня — с малого','Не нужно разбираться со всей жизнью за один день.'));const c=el('section','card');c.append(el('div','kicker','Главное сейчас'),el('h2','',habits.find(t=>t.id==='walk')?.name||'Выбрать одно посильное дело'),el('p','muted','Ради сил на себя и семью.'));const walk=habits.find(t=>t.id==='walk');if(walk){c.append(btn(walk.done?'Вернуть отметку':'Я сделал этот шаг','primary full',()=>{walk.done=!walk.done;message=walk.done?'На сегодня это уже результат. Отдохни или выбери ещё одно дело.':'';render();}));if(!walk.done)c.append(btn('Сейчас тяжело — сделать меньше','text full',()=>{walk.name='Выйти на две минуты';message='Так тоже считается. Масштаб действия можно менять.';render();}));}app.append(c);app.append(el('p','section-title','ОСТАЁТСЯ СО МНОЙ'));if(!habits.length)app.append(el('p','empty','Пока нет продолжающихся дел.'));habits.forEach(t=>app.append(task(t)));const active=health().stages[health().current];if(active.tasks?.length){app.append(el('p','section-title','ДЕЛА ЭТОГО ЭТАПА'));active.tasks.forEach(t=>app.append(task(t)));}app.append(el('p','feedback',message));const st=health().stages[health().current];const path=el('section','card');path.append(el('div','tag','Здоровье · текущий этап'),el('h2','',st.name),el('p','muted','Будущее — ориентир. Сегодня достаточно того, что по силам.'));if(health().current<health().stages.length-1)path.append(btn('Посмотреть следующий этап','full',()=>detail(health(),health().current+1)));app.append(path);}
function path(){app.append(title('Мой путь','Сейчас в разных сферах можно быть на разных этапах.'));if(message)app.append(el('p','feedback',message));const map=el('div','map');blocks.forEach(b=>{const lane=el('section','lane');lane.style.setProperty('--c',b.color);const head=el('div','lane-title');head.append(el('b','',b.name),el('small','','сейчас: '+(b.current+1)));lane.append(head);const dots=el('div','dots');b.stages.forEach((s,i)=>{const point=btn('',(i===b.current?'now ':'')+(locked(s)?'locked':''),()=>detail(b,i));point.setAttribute('aria-label',b.name+': '+s.name);point.append(el('i'),el('small','',i===b.current?'Сейчас':locked(s)?'Закрыт':String(i+1)));dots.append(point);});lane.append(dots);map.append(lane);});app.append(map);app.append(el('p','purpose','Хочу жить спокойнее, быть рядом с семьёй и иметь силы выбирать свою жизнь.'));app.append(btn('+ Намечу новый этап','full',builder));app.append(el('p','muted','Нажми на точку, чтобы понять этап. Его не обязательно наполнять прямо сейчас.'));}
function detail(b,i){const s=b.stages[i];open(s.name,(body,bar)=>{body.append(el('p','tag',b.name+' · '+(i===b.current?'текущий этап':'этап '+(i+1))),el('p','section-title','ЗАЧЕМ МНЕ ЭТО НАПРАВЛЕНИЕ'),el('p','purpose',b.why));if(s.why)body.append(el('p','section-title','СМЫСЛ ЭТОГО ЭТАПА'),el('p','muted',s.why));if(s.goals?.length){body.append(el('p','section-title','К ЧЕМУ ХОЧУ ПРИЙТИ'));const ul=el('ul','plain-list');s.goals.forEach(g=>ul.append(el('li','',g)));body.append(ul);}if(s.tasks?.length){body.append(el('p','section-title','ПОНЯТНЫЕ ДЕЛА'));const ul=el('ul','plain-list');s.tasks.forEach(t=>ul.append(el('li','',t.name)));body.append(ul);}if(s.barrier)body.append(el('p','muted','Что может мешать: '+s.barrier));if(s.gate){const box=el('div','lockbox');box.append(el('b','',reserve?'Условие выполнено':'Почему пока закрыт'),el('span','',reserve?'Готовность резерва подтверждена. Переход остаётся твоим решением.':'Нужно подтвердить готовность денег на выбранное платное обследование. Просто начать финансовый этап недостаточно.'));box.append(btn('Открыть цель в ресурсах','text full',()=>detail(blocks[1],1)));body.append(box,el('p','note','Обычная забота о себе и доступная помощь остаются в первых этапах. Этот замок относится только к выбранному платному варианту.'));}
if(b.id==='money'&&i===1){body.append(el('p','note','Пример: человек сам подтверждает фактическую готовность. Игровые монеты здесь не используются.'));bar.append(btn(reserve?'Снять подтверждение':'Резерв действительно готов','primary',()=>{reserve=!reserve;message=reserve?'Открылась возможность плановой заботы о здоровье.':'';close();render();}));}else if(b.id==='health'&&i>b.current){bar.append(btn(locked(s)?'Сначала выполнить условие':'Перейти к этому этапу','primary',()=>transition(i)));bar.lastChild.disabled=locked(s);}else bar.append(btn('Понятно','',close));});}
function transition(i){const s=health().stages[i];if(locked(s))return;open('Что продолжать дальше?',(body,bar)=>{body.append(el('p','muted','Новый этап: '+s.name),el('p','','Прогулка не должна теряться только потому, что ты двигаешься дальше. Выбери, что остаётся с тобой.'));const selected=new Set(habits.map(t=>t.id));if(!habits.length)body.append(el('p','muted','Продолжающихся дел пока нет.'));habits.forEach(t=>{const l=el('label','habit'),input=el('input');input.type='checkbox';input.checked=true;input.setAttribute('aria-label','Продолжать: '+t.name);input.addEventListener('change',()=>input.checked?selected.add(t.id):selected.delete(t.id));l.append(input,el('span','',t.name));body.append(l);});body.append(el('p','note','Отметки выбранных дел сохранятся. Остальные останутся у прежнего этапа в этом примере.'));bar.append(btn('Остаться здесь','',()=>detail(health(),i)),btn('Продолжить выбранное','primary',()=>{const previous=health().stages[health().current];previous.tasks=[...(previous.tasks||[]),...habits.filter(t=>!selected.has(t.id))];habits=habits.filter(t=>selected.has(t.id));health().current=i;message='Этап изменился. Выбранные дела остались с тобой.';close();tab='today';render();}));});}
function field(body,label,id,tag='input',placeholder=''){const l=el('label','field',label);l.htmlFor=id;const input=el(tag);input.id=id;if(tag==='input')input.type='text';input.placeholder=placeholder;input.maxLength=600;body.append(l,input);return input;}
function builder(){open('Намечу следующий этап',(body,bar)=>{const form=el('form');body.append(form);const group=field(form,'В каком направлении','new-block','select');blocks.forEach(b=>{const o=el('option','',b.name);o.value=b.id;group.append(o);});const name=field(form,'Название этапа','new-name','input','Например, найти удобный ритм');name.required=true;name.maxLength=100;const first=field(form,'Одно понятное дело · можно позже','new-task','input','Например, выбрать время для прогулки');const more=el('details');more.append(el('summary','','Смысл, цели и другие подробности'));form.append(more);const why=field(more,'Зачем именно этот этап · необязательно','new-why','textarea');const goals=field(more,'Цели · каждая с новой строки','new-goals','textarea');const tasks=field(more,'Ещё задания · каждое с новой строки','new-tasks','textarea');const barrier=field(more,'Что может мешать · необязательно','new-barrier');const gate=field(more,'Когда можно перейти','new-gate','select');for(const [v,t]of [['open','По моему решению'],['reserve','После готовности резерва на обследование']]){const o=el('option','',t);o.value=v;gate.append(o);}const error=el('p','error');error.setAttribute('role','alert');form.append(error);const lines=x=>x.value.split('\n').map(s=>s.trim()).filter(Boolean);form.addEventListener('submit',e=>{e.preventDefault();if(!name.value.trim()){error.textContent='Назови этап, остальное можно добавить позже.';return;}const b=blocks.find(b=>b.id===group.value);b.stages.push({name:name.value.trim(),why:why.value.trim(),goals:lines(goals),tasks:[first.value.trim(),...lines(tasks)].filter(Boolean).map(t=>({id:'new-'+(++serial),name:t,done:false})),barrier:barrier.value.trim(),gate:gate.value==='reserve'});close();tab='path';message='Этап сохранён вместе с содержимым.';render();detail(b,b.stages.length-1);});bar.append(btn('Отмена','',close),btn('Сохранить этап','primary',()=>form.requestSubmit()));});}
function render(){app.replaceChildren();const tabs=el('nav','tabs');tabs.setAttribute('aria-label','Раздел демо');for(const [id,label]of [['today','Сегодня'],['path','Мой путь']]){const b=btn(label,'',()=>{tab=id;render();});b.setAttribute('aria-pressed',String(tab===id));tabs.append(b);}app.append(tabs);tab==='today'?today():path();}
$('reset').addEventListener('click',()=>location.reload());render();})();
</script></body></html>
