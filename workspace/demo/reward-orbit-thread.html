<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Кольцо и нить · LifeGame</title>
<style>
:root{--accent:#ffd54a;--rgb:255,213,74;--ink:#eeeeda;--muted:#898981;--p:.33;--heat:.3}*{box-sizing:border-box}body{margin:0;background:#0c0c0c;color:#eeeee9;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}main{max-width:430px;margin:auto;padding:30px 20px 36px}header{margin-bottom:28px}h1{font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.4px;margin:0 0 8px}header p{font-size:12px;color:#8d8d84;margin:0;max-width:320px}.caption{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#b8ad87;margin:0 0 10px 2px;font-weight:600}section+section{margin-top:30px}.card{position:relative;isolation:isolate;border:1px solid #353531;border-radius:21px;background:linear-gradient(145deg,#202020,#151515);box-shadow:0 12px 30px #0002;--p:.33;--heat:.3}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible,.dial:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button,input{color:inherit}.orbit-card{display:flex;align-items:center;gap:16px;padding:21px 19px;min-height:185px}.orbit-card:before{content:'';position:absolute;inset:12px auto 12px 12px;width:150px;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),calc(.015 + var(--heat)*.04)),transparent 70%);z-index:-1;pointer-events:none}.dial{position:relative;flex:none;width:140px;height:140px;touch-action:none;cursor:grab;border-radius:50%;-webkit-user-select:none;user-select:none}.dial.dragging{cursor:grabbing}.dial svg{display:block;width:100%;height:100%;overflow:visible}.orbit-track{stroke:#393932;stroke-width:6;fill:none;stroke-linecap:round}.orbit-progress{stroke:url(#orbit-gold);stroke-width:6;stroke-linecap:round;fill:none;filter:drop-shadow(0 0 4px rgba(255,213,74,.2))}.orbit-head{fill:#fff5d4;stroke:#ffd54a;stroke-width:1.2;filter:drop-shadow(0 0 4px rgba(255,213,74,.9))}.orbit-aura{fill:#ffd54a;opacity:calc(.05 + var(--heat)*.15)}.tick{stroke:#6a695d;stroke-width:.8;stroke-linecap:round}.tick.passed{stroke:#c4b16b}.dial-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.value{appearance:textfield;-moz-appearance:textfield;border:0;border-radius:7px;background:transparent;outline-offset:1px;font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-1px}.value::-webkit-outer-spin-button,.value::-webkit-inner-spin-button{appearance:none;margin:0}.dial-center .value{width:88px;padding:5px 0;text-align:center;font-size:29px;font-weight:650;color:#fff0bc;pointer-events:auto;cursor:text;touch-action:auto}.orbit-side{flex:1;min-width:0}.quiet-title{font-size:12px;color:#c9c6b6;font-weight:500;margin:0 0 11px}.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.presets button{min-width:0;min-height:35px;padding:5px 3px;font-size:11px;border:1px solid #ffffff15;border-radius:9px;background:#ffffff03;color:#a8a89b;transition:background .15s,border-color .15s}.presets button[aria-pressed=true]{border-color:#ffd54a65;background:#ffd54a12;color:#ffe39a}.dial-edge{position:absolute;bottom:-5px;font-size:8px;color:#74746a;pointer-events:none}.dial-edge.min{left:25px}.dial-edge.max{right:16px}.thread-card{padding:18px 19px 13px;overflow:hidden}.thread-top{display:flex;align-items:center;justify-content:space-between;gap:15px}.thread-top .quiet-title{margin:0;color:#a7a69a}.thread-top .value{width:95px;text-align:right;color:#ffebaf;font-size:25px;font-weight:600;padding:3px 0}.thread-stage{position:relative;height:80px;margin:4px -4px 0;isolation:isolate}.thread-stage:before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at calc(12px + var(--p)*(100% - 24px)) 50%,rgba(var(--rgb),calc(.018 + var(--heat)*.055)),transparent 60%)}.thread-track{position:absolute;left:12px;right:12px;top:39px;height:1px;background:#44433b;pointer-events:none}.thread-fill{height:1px;width:calc(var(--p)*100%);background:linear-gradient(90deg,#9f8d4a,#ffe6a0);box-shadow:0 0 5px rgba(var(--rgb),calc(.1 + var(--heat)*.3))}.pin{position:absolute;left:calc(var(--at)*100%);top:0;width:3px;height:3px;border-radius:50%;transform:translate(-50%,-50%);background:#626055}.pin.passed{background:#c7b46c}.flare{position:absolute;left:calc(var(--p)*100%);top:0;pointer-events:none;z-index:1}.flare:before{content:'';position:absolute;left:0;top:0;width:calc(42px + var(--heat)*55px);height:1px;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,#fff1c4,transparent)}.flare:after{content:'';position:absolute;left:0;top:0;width:1px;height:calc(12px + var(--heat)*12px);transform:translate(-50%,-50%);background:linear-gradient(transparent,#fff8dc,transparent)}.core{position:absolute;left:0;top:0;width:5px;height:5px;transform:translate(-50%,-50%);border-radius:50%;background:#fff9e8;box-shadow:0 0 5px 1px #ffe9aa9c,0 0 calc(12px + var(--heat)*15px) calc(1px + var(--heat)*3px) rgba(var(--rgb),calc(.12 + var(--heat)*.35))}.thread-input{appearance:none;-webkit-appearance:none;position:absolute;left:12px;top:17px;width:calc(100% - 24px);height:44px;margin:0;padding:0;opacity:0;cursor:ew-resize;z-index:2;touch-action:pan-y}.thread-input::-webkit-slider-thumb{appearance:none;width:0;height:0}.thread-input::-moz-range-thumb{width:0;height:0;border:0}.thread-stage:focus-within{outline:1px solid #ffd54a55;outline-offset:1px;border-radius:10px}.thread-scale{display:flex;justify-content:space-between;color:#717168;font-size:9px;margin:-9px 7px 0}.thread-presets{display:flex;gap:7px;margin:16px 0 2px}.thread-presets button{flex:1;min-height:33px;font-size:11px}.footnote{margin:24px 2px 0;font-size:10px;color:#727269;line-height:1.6}.reset{margin:10px 0 0;padding:7px 2px;border:0;background:none;color:#a4a18e;font-size:11px;min-height:34px}
@media(max-width:350px){main{padding:24px 14px}.orbit-card{padding:18px 13px;gap:10px}.dial{width:120px;height:120px}.presets{gap:5px}.presets button{font-size:10px}.quiet-title{font-size:11px}.dial-center .value{font-size:26px;width:76px}.thread-card{padding-inline:15px}.dial-edge.min{left:19px}.dial-edge.max{right:10px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style></head><body><main>
<header><h1>Кольцо и нить</h1><p>Потяни любой регулятор. Значение общее — можно сравнить ощущения.</p></header>
<section aria-labelledby="orbit-label"><h2 class="caption" id="orbit-label">4 · Кольцо</h2><div class="card orbit-card">
<div class="dial" id="dial" role="slider" tabindex="0" aria-label="Награда, круговой регулятор" aria-valuemin="1" aria-valuemax="1000" aria-valuenow="50">
<svg viewBox="0 0 140 140" aria-hidden="true"><defs><linearGradient id="orbit-gold" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#b5a05b"/><stop offset=".65" stop-color="#ffd54a"/><stop offset="1" stop-color="#fff0bd"/></linearGradient></defs><g id="ticks"></g><path class="orbit-track" d="M34.64 105.36 A50 50 0 1 1 105.36 105.36"/><path class="orbit-progress" id="arc" d="M34.64 105.36 A50 50 0 1 1 105.36 105.36"/><circle class="orbit-aura" id="halo" r="11"/><circle class="orbit-head" id="knob" r="4.5"/></svg>
<div class="dial-center"><input id="orbit-number" class="value" type="number" min="1" max="1000" step="1" inputmode="numeric" aria-label="Точное значение награды"></div><span class="dial-edge min">1</span><span class="dial-edge max">1000</span></div>
<div class="orbit-side"><p class="quiet-title">Быстрый выбор</p><div class="presets" data-presets></div></div></div></section>
<section aria-labelledby="thread-label"><h2 class="caption" id="thread-label">5 · Нить</h2><div class="card thread-card"><div class="thread-top"><p class="quiet-title">Точное движение</p><input id="thread-number" class="value" type="number" min="1" max="1000" step="1" inputmode="numeric" aria-label="Точное значение награды для нити"></div><div class="thread-stage"><div class="thread-track"><div class="thread-fill"></div><div id="pins"></div><div class="flare"><i class="core"></i></div></div><input class="thread-input" id="thread" type="range" min="1" max="1000" step="1" aria-label="Награда, линейный регулятор"></div><div class="thread-scale" aria-hidden="true"><span>1</span><span>1000</span></div><div class="presets thread-presets" data-presets></div></div></section>
<p class="footnote">Только два регулятора. Ничего не начисляется и не сохраняется. Можно двигать пальцем, вводить число или использовать стрелки клавиатуры.</p><button type="button" class="reset" id="reset">Вернуть 50</button>
</main><script>
'use strict';
const stops=[1,10,50,100,250,500,1000],quick=[10,25,50,100,250,500],dial=document.getElementById('dial'),arc=document.getElementById('arc'),knob=document.getElementById('knob'),halo=document.getElementById('halo'),range=document.getElementById('thread'),numbers=[document.getElementById('orbit-number'),document.getElementById('thread-number')],cards=document.querySelectorAll('.card');
let value=50,dragAngle=null,dragPosition=null;
const clamp=n=>Math.max(1,Math.min(1000,Math.round(Number(n)||1)));
function toPosition(n){for(let k=1;k<stops.length;k++)if(n<=stops[k])return(k-1+(n-stops[k-1])/(stops[k]-stops[k-1]))/(stops.length-1);return 1}
function fromPosition(p){const t=Math.max(0,Math.min(1,p))*(stops.length-1),k=Math.min(stops.length-2,Math.floor(t));return clamp(stops[k]+(stops[k+1]-stops[k])*(t-k))}
const arcLength=arc.getTotalLength();
function point(p){return arc.getPointAtLength(arcLength*p)}
for(const n of stops){const p=toPosition(n),angle=(135+p*270)*Math.PI/180;const tick=document.createElementNS('http://www.w3.org/2000/svg','line');for(const [key,val]of Object.entries({x1:70+59*Math.cos(angle),y1:70+59*Math.sin(angle),x2:70+62*Math.cos(angle),y2:70+62*Math.sin(angle),'class':'tick'}))tick.setAttribute(key,val);tick.dataset.n=n;document.getElementById('ticks').append(tick);const pin=document.createElement('i');pin.className='pin';pin.dataset.n=n;pin.style.setProperty('--at',p);document.getElementById('pins').append(pin)}
for(const parent of document.querySelectorAll('[data-presets]'))for(const n of quick){const button=document.createElement('button');button.type='button';button.dataset.n=n;button.textContent=n;button.setAttribute('aria-label','Выбрать '+n);button.addEventListener('click',()=>set(n));parent.append(button)}
function set(n){value=clamp(n);const p=toPosition(value),heat=.1+.9*p;for(const card of cards){card.style.setProperty('--p',p);card.style.setProperty('--heat',heat)}arc.style.strokeDasharray=arcLength;arc.style.strokeDashoffset=arcLength*(1-Math.max(.001,p));const pt=point(p);for(const node of [knob,halo]){node.setAttribute('cx',pt.x);node.setAttribute('cy',pt.y)}for(const input of numbers)if(document.activeElement!==input)input.value=value;range.value=1+Math.round(p*999);range.setAttribute('aria-valuetext',String(value));dial.setAttribute('aria-valuenow',value);dial.setAttribute('aria-valuetext',String(value));for(const node of document.querySelectorAll('.tick,.pin'))node.classList.toggle('passed',value>=Number(node.dataset.n));for(const button of document.querySelectorAll('[data-presets] button'))button.setAttribute('aria-pressed',String(value===Number(button.dataset.n)))}
range.addEventListener('input',()=>set(fromPosition((Number(range.value)-1)/999)));
for(const input of numbers){input.addEventListener('input',()=>{if(input.value!==''&&Number.isFinite(input.valueAsNumber))set(input.valueAsNumber)});input.addEventListener('blur',()=>{set(input.value);input.value=value});input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();input.blur()}})}
function angleAt(e){const box=dial.getBoundingClientRect();return(Math.atan2(e.clientY-box.top-box.height/2,e.clientX-box.left-box.width/2)*180/Math.PI-135+360)%360}
function useAngle(a){const limited=a<=270?a:(toPosition(value)>.5?270:0);dragPosition=limited;set(fromPosition(limited/270))}
dial.addEventListener('pointerdown',e=>{if(e.target.closest('input'))return;e.preventDefault();dial.setPointerCapture(e.pointerId);dial.classList.add('dragging');dragAngle=angleAt(e);useAngle(dragAngle)});
dial.addEventListener('pointermove',e=>{if(!dial.hasPointerCapture(e.pointerId))return;const next=angleAt(e);if(dragAngle!==null){let delta=next-dragAngle;if(delta>180)delta-=360;if(delta<-180)delta+=360;dragPosition+=delta;set(fromPosition(Math.max(0,Math.min(270,dragPosition))/270))}dragAngle=next});
for(const event of ['pointerup','pointercancel','lostpointercapture'])dial.addEventListener(event,()=>{dragAngle=null;dragPosition=null;dial.classList.remove('dragging')});
dial.addEventListener('keydown',e=>{if(e.target!==dial)return;let next=value;if(e.key==='ArrowRight'||e.key==='ArrowUp')next+=e.shiftKey?10:1;else if(e.key==='ArrowLeft'||e.key==='ArrowDown')next-=e.shiftKey?10:1;else if(e.key==='PageUp')next+=50;else if(e.key==='PageDown')next-=50;else if(e.key==='Home')next=1;else if(e.key==='End')next=1000;else return;e.preventDefault();set(next)});
document.getElementById('reset').addEventListener('click',()=>{for(const input of numbers)input.blur();set(50)});set(value);
</script></body></html>
