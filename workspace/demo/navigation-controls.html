<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101010"><title>LifeGame — демо навигации</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0b;--card:#191919;--line:#343434;--text:#f0f0ed;--muted:#aaa;--accent:#ffdf45;--green:#acd2b9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}button,article,section{min-width:0}[hidden]{display:none!important}.app{max-width:480px;margin:auto;min-height:100dvh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}.topbar{height:70px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);background:#101010}.brand{font-size:12px;font-weight:700;letter-spacing:2px;white-space:nowrap}.brand i{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin-right:9px}.demo-label{color:#888;font-size:10px;letter-spacing:1px;text-transform:uppercase}.top-history{margin-left:-8px}.history{display:flex;align-items:center;gap:0;flex:none}.history button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:none;color:#e4e4e4}.history button:disabled{color:#4e4e4e}.history button:not(:disabled):active{background:#ffffff0c}.history svg{width:21px;height:21px}.comparison{margin:16px 20px 24px}.comparison>span{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}.variants{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#151515;border:1px solid #303030;border-radius:12px;padding:4px}.variants button{min-height:40px;font-size:12px;border:1px solid transparent;border-radius:8px;background:none;color:#999}.variants button[aria-pressed=true]{background:#292929;border-color:#424242;color:#eee}main{padding:0 20px}main:focus{outline:none}h1{font-size:28px;line-height:1.2;letter-spacing:-.8px;margin:0 0 10px}h2{font-size:16px;line-height:1.4;margin:0}p{margin:8px 0;color:var(--muted)}.intro{font-size:12px;margin-bottom:23px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--green);margin:0 0 14px}.card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:16px;margin-bottom:12px}.link-card{display:flex;align-items:center;gap:13px;width:100%;text-align:left;min-height:86px}.link-card>svg:last-child{width:16px;color:#929292}.copy{flex:1;min-width:0}.copy strong{font-size:14px;display:block}.copy small{display:block;color:#aaa;font-size:11px;margin-top:4px}.tile{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid #ffdf4533;background:#ffdf450a;color:var(--accent);flex:none}.tile.mint{color:#acd2b9;background:#acd2b90b;border-color:#acd2b933}.tile.blue{color:#9cb9ed;background:#9cb9ed0b;border-color:#9cb9ed33}.primary{background:var(--accent);color:#13130e;border-color:var(--accent)}.primary .tile{color:#28220b;border-color:#34290025;background:#34290007}.primary small{color:#4d431b}.metric{font-size:30px;letter-spacing:-1px;line-height:1.2;margin-top:15px}.metric small{font-size:14px;color:#aaa;letter-spacing:0}.track{height:4px;background:#ffffff12;border-radius:8px;margin:15px 0}.track i{display:block;width:65%;height:100%;background:var(--green);border-radius:8px}.card-bottom{border-top:1px solid #ffffff12;padding-top:12px;margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#aaa;font-size:11px}.small-link{min-height:44px;padding:7px 12px;border:1px solid #414141;background:none;border-radius:11px;font-size:12px}.section-row{display:flex;gap:9px;align-items:center;margin:23px 0 12px;font-size:12px;font-weight:650}.section-row svg{color:var(--accent);width:17px}.task{margin-bottom:10px}.task h2{margin:10px 0 18px;font-size:16px}.kind{font-size:11px;color:#aaa;display:flex;align-items:center;gap:6px}.kind svg{width:15px;color:var(--accent)}.task .card-bottom{font-size:12px}.pill{font-size:10px;border:1px solid #4c4c4c;border-radius:99px;padding:4px 8px;color:#aaa}.task-footer{display:flex;justify-content:space-between;align-items:center}.task-footer strong{font-size:18px;color:var(--accent)}.static-status{font-size:11px;color:#aaa}.page-note{font-size:11px;color:#777;line-height:1.6;margin:25px 2px 0}.route-hint{font-size:11px;color:#888;margin:23px 0 0}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;display:flex;align-items:center;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #353535;background:#101010;z-index:10}.bottom-history{padding-right:8px;border-right:1px solid #303030}.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:1;gap:4px;min-width:0}.tab{min-height:52px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;border:0;border-radius:13px;background:none;color:#aaa;font-size:10px;position:relative}.tab svg{width:21px;height:21px}.tab[aria-current=page]{color:var(--accent);background:#ffdf4509}.tab[aria-current=page]:before{content:'';height:2px;width:21px;border-radius:2px;background:var(--accent);position:absolute;top:0}.page-enter{animation:pageEnter .15s ease-out}@keyframes pageEnter{from{opacity:.5;translate:0 4px}to{opacity:1;translate:0 0}}.sr-only{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}@media(prefers-reduced-motion:reduce){.page-enter{animation:none}}@media(max-width:350px){.topbar{padding-inline:14px}.comparison{margin-inline:16px}main{padding-inline:16px}.bottom{gap:5px;padding-inline:6px}.bottom-history{padding-right:5px}.history button{width:44px}.tab{font-size:9px}h1{font-size:26px}.brand{font-size:11px;letter-spacing:1.5px}.card{padding:14px}}

/* Screen history above; independent section strip below. */
.topbar{position:sticky;top:0;z-index:9;padding-inline:12px;display:grid;grid-template-columns:44px 1fr 44px}.topbar .brand{text-align:center}.history-button{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:12px;color:#eee}.history-button:disabled{color:#484848}.history-button svg{width:23px;height:23px}.history-button:not(:disabled):active{background:#ffffff0b}
main{padding-top:26px}.bottom{gap:4px;padding-inline:6px}.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 calc(100% / 3);scroll-snap-align:start;min-width:0;white-space:nowrap}.tab-scroll{display:grid;place-items:center;flex:0 0 44px;min-height:48px;border:0;background:none;color:#aaa;border-radius:10px;padding:0}.tab-scroll svg{width:14px;height:14px}.tab-scroll:disabled{color:#414141}.tab-scroll:not(:disabled):active{background:#ffffff09}.preview-card{padding:24px}.preview-card h2{margin:18px 0 8px}.preview-card p{font-size:12px}
</style>
</head>
<body><div class="app">
<header class="topbar"><button class="history-button" id="history-back" aria-label="Назад" disabled></button><div class="brand"><i></i>LIFE / GAME</div><button class="history-button" id="history-forward" aria-label="Вперёд" disabled></button></header>
<main id="screen" tabindex="-1"></main>
<nav class="bottom" aria-label="Навигация демо"><button class="tab-scroll" id="tabs-left" aria-label="Прокрутить разделы влево" aria-controls="sections" disabled></button><div class="tabs" id="sections" aria-label="Разделы"></div><button class="tab-scroll" id="tabs-right" aria-label="Прокрутить разделы вправо" aria-controls="sections"></button></nav>
<div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</div>
<script>
'use strict';
const icons={calendar:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18M7 14h2M15 14h2"/>',quest:'<path d="m12 3 8 9-8 9-8-9Z"/>',bonus:'<path d="m12 2 2.7 7.3L22 12l-7.3 2.7L12 22l-2.7-7.3L2 12l7.3-2.7Z"/>',back:'<path d="m14 5-7 7 7 7"/>',forward:'<path d="m10 5 7 7-7 7"/>',home:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="5"/>',blocks:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9h16M4 15h16M9 4v16M15 4v16"/>',day:'<rect x="4" y="4" width="16" height="17" rx="2"/><path d="M9 3h6v4H9zM8 12l1 1 2-2M14 12h3M8 17l1 1 2-2M14 17h3"/>',chevron:'<path d="m9 5 7 7-7 7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',health:'<path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-4 4 2 10 8 15C18 15 24 9 20 5Z"/>',book:'<path d="M12 5v16M3 4c4-1 6 0 9 1 3-1 5-2 9-1v16c-4-1-6 0-9 1-3-1-5-2-9-1Z"/>',list:'<path d="M8 5h12M8 12h12M8 19h12M3 5h.1M3 12h.1M3 19h.1"/>'};
const svg=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[name]+'</svg>';
const names={home:'Главная',blocks:'Блоки',day:'Конструктор дня',calendar:'Календарь',quests:'Квесты',bonuses:'Бонусы'};
const screen=document.getElementById('screen'),back=document.getElementById('history-back'),forward=document.getElementById('history-forward');
let trail=['home'],cursor=0,scrolls=new Map();
const token=String(Date.now())+Math.random();
history.replaceState({demo:token,cursor:0,page:'home'},'',location.pathname+location.search+'#home');
function card(title,sub,icon,page,tone=''){return '<button class="card link-card '+(tone==='primary'?'primary':'')+'" data-go="'+page+'"><span class="tile '+(tone==='primary'?'':tone)+'">'+svg(icon)+'</span><span class="copy"><strong>'+title+'</strong><small>'+sub+'</small></span>'+svg('chevron')+'</button>'}
function content(page){
 if(['calendar','quests','bonuses'].includes(page)){const icon=({calendar:'calendar',quests:'quest',bonuses:'bonus'})[page];return '<h1>'+names[page]+'</h1><p class="intro">Демонстрационный раздел</p><article class="card preview-card"><span class="tile">'+svg(icon)+'</span><h2>'+({calendar:'Планы и события',quests:'Большие цели — маленькими шагами',bonuses:'Награды для себя'})[page]+'</h2><p>Пока только пример экрана для проверки навигации.</p></article>';}
 if(page==='home')return '<p class="eyebrow">Сегодня — твой день</p><h1>Главная</h1><p class="intro">Спокойно. По одному делу за раз.</p>'+card('Конструктор дня','Собери свой сегодняшний день','day','day','primary')+card('Блоки времени','Выбери, чем наполнить жизнь','blocks','blocks')+'<article class="card"><div class="kind">'+svg('clock')+'Посильный план</div><div class="metric">35 <small>/ 60 мин</small></div><div class="track"><i></i></div><div class="card-bottom"><span>25 мин в запасе</span><button class="small-link" data-go="day">Мой план ›</button></div></article><p class="route-hint">Сверху — история экранов. Нижние стрелки листают разделы.</p>';
 if(page==='blocks')return '<h1>Блоки времени</h1><p class="intro">Выбери, чем наполнить жизнь</p>'+card('Физическое состояние','Прогулка · на сегодня','health','day','mint')+card('Знания, навыки, опыт','Чтение · на сегодня','book','day','blue')+'<p class="page-note">Открой дело — попадёшь в сегодняшний план.</p>';
 return '<h1>Конструктор дня</h1><p class="intro">Собери день который хочешь прожить</p><article class="card"><div class="kind">'+svg('clock')+'Посильный план</div><div class="metric">35 <small>/ 60 мин</small></div><div class="track"><i></i></div><div class="card-bottom"><span>Два небольших дела</span><span class="pill">На сегодня</span></div></article><div class="section-row">'+svg('list')+'Задания <span class="static-status">2</span></div><article class="card task"><div class="kind">Физическое состояние</div><h2>Прогуляться 15 минут</h2><div class="task-footer"><strong>+25 ●</strong><span class="pill">15 минут</span></div></article><article class="card task"><div class="kind">Знания, навыки, опыт</div><h2>Прочитать несколько страниц</h2><div class="task-footer"><strong>+25 ●</strong><span class="pill">20 минут</span></div></article><p class="page-note">Демонстрационный день. Здесь можно только переходить между экранами.</p>';
}
back.innerHTML=svg('back');forward.innerHTML=svg('forward');back.addEventListener('click',()=>{if(cursor>0)history.back()});forward.addEventListener('click',()=>{if(cursor<trail.length-1)history.forward()});
function controls(){back.disabled=cursor===0;forward.disabled=cursor===trail.length-1;for(const tab of document.querySelectorAll('.tab')){if(tab.dataset.go===trail[cursor]){tab.setAttribute('aria-current','page');const start=tab.offsetLeft-tabs.offsetLeft,end=start+tab.offsetWidth;if(start<tabs.scrollLeft)tabs.scrollLeft=start;else if(end>tabs.scrollLeft+tabs.clientWidth)tabs.scrollLeft=end-tabs.clientWidth;}else tab.removeAttribute('aria-current')}scrollButtons()}
function render(restore=false){const page=trail[cursor];screen.innerHTML=content(page);screen.dataset.page=page;screen.classList.remove('page-enter');void screen.offsetWidth;screen.classList.add('page-enter');controls();document.title=names[page]+' — LifeGame · демо';window.scrollTo(0,restore?(scrolls.get(page)||0):0);screen.focus({preventScroll:true});document.getElementById('announcement').textContent=names[page]}
function go(page){if(!names[page]||page===trail[cursor])return;scrolls.set(trail[cursor],scrollY);trail=trail.slice(0,cursor+1);trail.push(page);cursor++;history.pushState({demo:token,cursor,page},'',location.pathname+location.search+'#'+page);render()}
window.addEventListener('popstate',event=>{const s=event.state;if(!s||s.demo!==token||trail[s.cursor]!==s.page)return;scrolls.set(trail[cursor],scrollY);cursor=s.cursor;render(true)});
const tabs=document.querySelector('.tabs');for(const [page,label,icon]of[['home','Главная','home'],['blocks','Блоки','blocks'],['day','День','day'],['calendar','Календарь','calendar'],['quests','Квесты','quest'],['bonuses','Бонусы','bonus']]){const b=document.createElement('button');b.className='tab';b.dataset.go=page;b.innerHTML=svg(icon)+'<span>'+label+'</span>';tabs.append(b)}
const left=document.getElementById('tabs-left'),right=document.getElementById('tabs-right');left.innerHTML=svg('back');right.innerHTML=svg('forward');
function scrollButtons(){left.disabled=tabs.scrollLeft<=1;right.disabled=tabs.scrollLeft+tabs.clientWidth>=tabs.scrollWidth-1}
function scrollTabs(direction){tabs.scrollBy({left:direction*tabs.clientWidth/3,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'})}
left.addEventListener('click',()=>scrollTabs(-1));right.addEventListener('click',()=>scrollTabs(1));tabs.addEventListener('scroll',scrollButtons,{passive:true});window.addEventListener('resize',scrollButtons);
document.addEventListener('click',event=>{const target=event.target.closest('[data-go]');if(target)go(target.dataset.go)});

render();
</script></body></html>
