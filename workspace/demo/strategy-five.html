  const el=(tag,cls='',text)=>{const n=document.createElement(tag);n.className=cls;if(text!==undefined)n.textContent=text;return n;};
  function icon(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',paths[name]||paths.flag);s.append(p);return s;}
  const btn=(text,cls,fn,glyph)=>{const n=el('button',cls);n.type='button';if(glyph)n.append(icon(glyph));if(text)n.append(document.createTextNode(text));n.addEventListener('click',fn);return n;};
  const ib=(glyph,label,fn)=>{const b=btn('','icon-button',fn,glyph);b.setAttribute('aria-label',label);return b;};
  const byId=id=>blocks.find(b=>b.id===id),current=()=>byId(active);
  const brand=()=>el('div','brand','LIFE / GAME');
  const tile=b=>{const t=el('span','tile '+b.id);t.append(icon(b.icon));return t;};
  function labNav(){
    lab.replaceChildren();if(!mode){lab.hidden=true;return;}
    document.title=mode+'. '+modes[mode-1][0]+' — LifeGame';
    const home=el('a');home.href='strategy-five.html';home.setAttribute('aria-label','Все пять вариантов');home.append(icon('menu'));
    const previous=btn('','',()=>location.assign('?v='+(mode-1)),'back');previous.setAttribute('aria-label','Предыдущий вариант');previous.disabled=mode===1;
    const select=el('select');select.setAttribute('aria-label','Вариант демо');modes.forEach(([name],i)=>select.append(new Option((i+1)+'. '+name,String(i+1))));select.value=String(mode);select.addEventListener('change',()=>location.assign('?v='+select.value));
    const nextButton=btn('','',()=>location.assign('?v='+(mode+1)),'chevron');nextButton.setAttribute('aria-label','Следующий вариант');nextButton.disabled=mode===5;lab.append(home,previous,select,nextButton);
  }
  function reset(){blocks=structuredClone(seed);done.clear();goals.clear();active='health';chosen={};next={};customTargets=[];targetIndex=0;chosenTarget=null;close();render();scrollTo(0,0);}
  function top(){const n=el('div','top');n.append(brand(),btn('Сначала','text-button',reset,'history'));return n;}
  function intro(title,note){const n=el('header','intro');n.append(el('h1','',title),el('p','muted',note));return n;}
  function redraw(focusKey=null){const y=scrollY;render();if(sheet.open&&sheet.dataset.source)sourceSheet(byId(sheet.dataset.source));scrollTo(0,y);if(focusKey)requestAnimationFrame(()=>[...(sheet.open?sheet:app).querySelectorAll('[data-task]')].find(n=>n.dataset.task===focusKey)?.focus({preventScroll:true}));}
  function task(t){const label=el('label','task'+(done.has(t.id)?' done':'')),check=el('input');check.type='checkbox';check.checked=done.has(t.id);check.dataset.task=t.id;check.setAttribute('aria-label',t.title);
    check.addEventListener('change',()=>{if(mode===3){const owner=blocks.find(b=>b.tasks.some(x=>x.id===t.id));if(owner)active=owner.id;}check.checked?done.add(t.id):done.delete(t.id);redraw(t.id);});label.append(check,el('span','task-text',t.title));if(t.time)label.append(el('span','time',t.time));return label;
  }
  function meaning(b){if(!b.meaning)return null;const n=el('div','meaning');n.append(el('div','kicker','Смысл'),el('p','',b.meaning));return n;}
  function goal(b){if(!b.goal)return null;const n=el('div','goal'+(goals.has(b.id)?' done':'')),copy=el('div','goal-copy');copy.append(el('p','kicker',goals.has(b.id)?'Цель · отмечена':'Цель'),el('h3','',b.goal));const check=btn('','goal-action',()=>{goals.has(b.id)?goals.delete(b.id):goals.add(b.id);redraw();},goals.has(b.id)?'check':'flag');check.setAttribute('aria-label',(goals.has(b.id)?'Вернуть цель: ':'Отметить цель: ')+b.goal);check.setAttribute('aria-pressed',String(goals.has(b.id)));n.append(copy,check);return n;}
  function heading(b){const n=el('header','sphere-heading');n.append(tile(b),el('h2','',b.name));return n;}
  function tabs(){const n=el('nav','block-tabs');n.setAttribute('aria-label','Блок');for(const b of blocks){const x=btn(b.short,b.id,()=>{active=b.id;render();},b.icon);x.setAttribute('aria-label',b.name);x.setAttribute('aria-pressed',String(b.id===active));n.append(x);}return n;}
  function blockCard(b){const n=el('article','block '+b.id);n.dataset.block=b.id;n.append(heading(b));const m=meaning(b),g=goal(b);if(m)n.append(m);if(g)n.append(g);const tasks=el('div','tasks');for(const t of b.tasks)tasks.append(task(t));n.append(tasks);return n;}
  function simpleAll(){const p=el('div','page');p.append(top(),intro('Мои блоки','Смысл, цель и дела уже на своих местах. Просто отмечай сделанное.'));for(const b of blocks)p.append(blockCard(b));p.append(el('p','quiet-note','Вымышленный пример данных из блоков. Обновление сбрасывает отметки.'));return p;}
  function schema(){const b=current(),p=el('div','page '+b.id);p.append(top(),tabs());const h=el('header','schema-head');h.append(el('h1','',b.name),el('p','muted','Весь путь этого блока — перед глазами.'));p.append(h);const spine=el('div','spine');
    const m=meaning(b);if(m){const n=el('div','schema-node meaning-node');n.append(m);spine.append(n);}
    const g=goal(b);if(g){const n=el('div','schema-node goal-node');n.append(g);spine.append(n);}
    for(const t of b.tasks){const n=el('div','schema-node task-node');n.append(el('div','kicker','Дело'),task(t));spine.append(n);}p.append(spine,el('p','schema-foot',b.meaning||b.goal?'Отметки дел и достижение цели — отдельно.':'В этом блоке только дело. Этого достаточно.'));return p;
  }
  function close(){sheet.close();}
  function openSheet(title,build){
    sheet.replaceChildren();delete sheet.dataset.source;const h=el('header','sheet-header'),titleNode=el('h2','',title);titleNode.id='sheet-title';h.append(titleNode,ib('close','Закрыть',close));const body=el('div','sheet-body'),actions=el('div','sheet-actions');sheet.append(h,body);build(body,actions);if(actions.children.length)sheet.append(actions);document.body.classList.add('sheet-open');if(!sheet.open)sheet.showModal();
  }
  sheet.addEventListener('close',()=>document.body.classList.remove('sheet-open'));
  function addIdea(b){openSheet('Что может быть дальше?',(body,actions)=>{
    body.append(el('p','muted','Одна идея для блока «'+b.short+'». Пока без сроков и условий.'));const form=el('form'),label=el('label','','Моя идея'),input=el('input'),error=el('p','error');input.id='idea-title';input.maxLength=100;input.required=true;input.placeholder='Например, попробовать новый маршрут';label.htmlFor=input.id;error.hidden=true;error.setAttribute('role','alert');form.append(label,input,error);body.append(form);
    actions.append(btn('Добавить','primary',()=>form.requestSubmit()));form.addEventListener('submit',e=>{e.preventDefault();if(!input.value.trim()){error.textContent='Напиши, что хотелось бы попробовать.';error.hidden=false;return;}
      const idea={id:'idea-'+(++serial),title:input.value.trim()};b.ideas.push(idea);chosen[b.id]=idea.id;next[b.id]=idea.id;close();redraw();});
  });}
  function ideas(b,timeline=false){const area=el('div','future-area'),header=el('div','future-title');header.append(el('h3','','После этого'),btn('＋ Моя идея','text-button',()=>addIdea(b)));area.append(header);
    for(const idea of b.ideas){const n=btn('','idea',()=>{chosen[b.id]=idea.id;if(timeline)next[b.id]=idea.id;redraw();});n.setAttribute('aria-pressed',String(chosen[b.id]===idea.id));n.append(el('span','',idea.title),icon(chosen[b.id]===idea.id?'check':'chevron'));area.append(n);}
    const selected=b.ideas.find(x=>x.id===chosen[b.id]);area.append(el('p','chosen-note',selected?'На потом: '+selected.title:'Можно выбрать идею или оставить решение на потом.'));return area;
  }
  function swipes(){const p=el('div','swipe-page'),header=el('header','swipe-head');header.append(top(),el('h1','','Мои направления'),el('p','muted','Одна сфера — одна страница. Листай пальцем.'));p.append(header);
    const nav=el('nav','swipe-tabs');nav.setAttribute('aria-label','Страница направления');const track=el('div','swipe-track');track.setAttribute('aria-label','Страницы направлений');track.tabIndex=0;
    blocks.forEach((b,i)=>{const tab=btn(String(i+1),'',()=>track.scrollTo({left:i*track.clientWidth,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'}));tab.setAttribute('aria-label',b.name);tab.setAttribute('aria-pressed',String(active===b.id));nav.append(tab);
      const slide=el('section','swipe-slide '+b.id);slide.setAttribute('aria-label',b.name);slide.setAttribute('aria-roledescription','страница');const card=el('div','slide-card');card.append(heading(b));const m=meaning(b),g=goal(b);if(m)card.append(m);if(g)card.append(g);const ts=el('div','tasks');b.tasks.forEach(t=>ts.append(task(t)));card.append(ts,ideas(b));slide.append(card);track.append(slide);
    });p.append(nav,track,el('p','quiet-note','Листай ← → или нажимай номера страниц.'));
    let frame=0;track.addEventListener('scroll',()=>{cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const index=Math.max(0,Math.min(blocks.length-1,Math.round(track.scrollLeft/track.clientWidth)));active=blocks[index].id;[...nav.children].forEach((t,i)=>t.setAttribute('aria-pressed',String(i===index)));});},{passive:true});
    track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const i=blocks.findIndex(b=>b.id===active)+(e.key==='ArrowRight'?1:-1);track.scrollTo({left:Math.max(0,Math.min(blocks.length-1,i))*track.clientWidth,behavior:'smooth'});}});
    requestAnimationFrame(()=>track.scrollTo({left:blocks.findIndex(b=>b.id===active)*track.clientWidth,behavior:'instant'}));return p;
  }
  function sourceSheet(b){openSheet(b.name,(body,actions)=>{body.append(blockCard(b));actions.append(btn('Вернуться к пути','primary',close));});sheet.dataset.source=b.id;}
  function newTarget(){openSheet('Мой вариант пути',(body,actions)=>{
    const form=el('form'),label=el('label','','Куда я хочу прийти?'),name=el('input');name.id='target-name';name.required=true;name.maxLength=100;name.placeholder='Например, устроить маленькое путешествие';label.htmlFor=name.id;
    const taskLabel=el('label','','С какого маленького дела могу начать?'),first=el('input');first.id='target-step';first.required=true;first.maxLength=100;first.placeholder='Один понятный шаг';taskLabel.htmlFor=first.id;const error=el('p','error');error.hidden=true;error.setAttribute('role','alert');form.append(label,name,taskLabel,first,error);body.append(form,el('p','muted','Можно записать только своё видение. Даты, условия и награды сейчас не нужны.'));actions.append(btn('Посмотреть путь','primary',()=>form.requestSubmit()));
    form.addEventListener('submit',e=>{e.preventDefault();if(!name.value.trim()||!first.value.trim()){error.hidden=false;error.textContent='Напиши желание и один небольшой шаг.';return;}
      const id='target-'+(++serial);customTargets.push({id,short:'Мой путь',name:name.value.trim(),why:'Моё выбранное направление.',icon:'flag',custom:{id:'step-'+serial,title:first.value.trim(),time:''}});targetIndex=targets().length-1;chosenTarget=id;close();render();scrollTo(0,0);});
  });}
  function destination(){const p=el('div','page');p.append(top(),el('p','kicker','Сначала — куда хочу прийти'));const tab=el('nav','destination-tabs');tab.setAttribute('aria-label','Будущее');const all=targets();all.forEach((t,i)=>{const b=btn(t.short,'',()=>{targetIndex=i;render();});b.setAttribute('aria-pressed',String(targetIndex===i));tab.append(b);});p.append(tab);const t=all[targetIndex]||all[0],hero=el('header','destination-hero');hero.append(icon(t.icon),el('p','kicker','Моё возможное будущее'),el('h1','',t.name),el('p','',t.why));p.append(hero,el('p','route-caption','Я сейчас · могу начать с малого'));
    const route=el('div','route-steps'),refs=t.custom?[[null,t.custom]]:t.refs.map(([id,key])=>[byId(id),byId(id).tasks.find(x=>x.id===key)]);
    refs.forEach(([b,action])=>{const n=el('article','route-step '+(b?.id||''));if(b)n.append(btn(b.short,'source',()=>sourceSheet(b),b.icon));else n.append(el('p','kicker','Мой первый шаг'));n.append(task(action));route.append(n);});p.append(route);
    const note=refs.every(([,action])=>done.has(action.id))?'Эти подготовительные дела отмечены. Достижение результата оцениваешь сам.':'Небольшие действия, которые могут помочь этому направлению.';p.append(el('p','muted',note));const actions=el('div','destination-bottom');const pick=btn(chosenTarget===t.id?'✓ Этот путь выбран':'Хочу идти этим путём','primary',()=>{chosenTarget=t.id;redraw();});pick.setAttribute('aria-pressed',String(chosenTarget===t.id));actions.append(pick,btn('Свой вариант','secondary',newTarget,'plus'));p.append(actions);return p;
  }
  function timeline(){const b=current(),p=el('div','page '+b.id);p.append(top(),tabs(),el('h1','timeline-title',b.goal||b.name));if(b.meaning)p.append(el('p','timeline-purpose',b.meaning));const line=el('div','timeline');
    const history=el('section','time-section'),label=el('p','section-label','Уже сделано'),box=el('details','history-box'),summary=el('summary');summary.append(icon('check'),document.createTextNode((b.past.length+b.tasks.filter(t=>done.has(t.id)).length)===1?'1 маленький шаг':(b.past.length+b.tasks.filter(t=>done.has(t.id)).length)+' маленьких шага'));box.append(summary);
    for(const name of b.past){const row=el('div','history-record');row.append(icon('check'),el('span','',name));box.append(row);}
    for(const t of b.tasks.filter(t=>done.has(t.id))){const row=el('div','history-record'),undo=btn('','',()=>{done.delete(t.id);redraw();},'undo');undo.setAttribute('aria-label','Вернуть дело: '+t.title);row.append(icon('check'),el('span','',t.title),undo);box.append(row);}history.append(label,box);line.append(history);
    const now=el('section','time-section current'),currentBox=el('div','current-box'),pending=b.tasks.filter(t=>!done.has(t.id));now.append(el('p','section-label','Я сейчас'));
    if(pending.length)pending.forEach(t=>currentBox.append(task(t)));else currentBox.append(el('p','muted','Дела этого этапа отмечены. Можно выбрать продолжение.'));now.append(currentBox);if(b.goal){const g=goal(b);now.append(g);}line.append(now);
    const future=el('section','time-section');future.append(el('p','section-label','Дальше — по моему выбору'));const selected=b.ideas.find(i=>i.id===(next[b.id]||b.ideas[0].id));const n=el('div','current-box');n.append(el('p','',selected.title));n.style.padding='17px';future.append(n);
    const others=el('details','later-link');others.append(el('summary','','Выбрать другое продолжение'));for(const idea of b.ideas){const x=btn(idea.title,'idea',()=>{next[b.id]=idea.id;chosen[b.id]=idea.id;redraw();},next[b.id]===idea.id?'check':'arrow');x.setAttribute('aria-pressed',String(idea.id===selected.id));others.append(x);}future.append(others,btn('＋ Моя идея','text-button',()=>addIdea(b)));line.append(future);p.append(line);return p;
  }
  function hub(){const p=el('div','hub');p.append(brand(),el('h1','','Пять способов увидеть свой путь'),el('p','muted','Сначала попробуй два самых простых. Затем — три варианта, в которых можно чуть-чуть планировать.'));
    modes.forEach(([name,note],i)=>{const a=el('a','concept');a.href='?v='+(i+1);const h=el('div','concept-title');h.append(el('span','num',String(i+1)),el('h2','',name));a.append(h);if(i<2)a.append(el('span','simple-tag','ТОЛЬКО ДАННЫЕ ИЗ БЛОКОВ + ВЫПОЛНЕНИЕ'));a.append(el('p','',note));const open=el('span','open','Попробовать');open.append(icon('arrow'));a.append(open);p.append(a);});
    p.append(el('p','note','Внутри — одинаковые вымышленные блоки. Можно нажимать, отмечать дела и менять своё решение. Все отметки исчезнут при обновлении страницы. Основное приложение не затрагивается.'));return p;
  }
  function render(){app.replaceChildren(!mode?hub():mode===1?simpleAll():mode===2?schema():mode===3?swipes():mode===4?destination():timeline());}
  labNav();render();
})();

</script></body></html>
