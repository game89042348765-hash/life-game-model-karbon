<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LifeGame · схема</title><style>
*{box-sizing:border-box}body{margin:0;background:#090909;color:#eee;font:14px/1.5 system-ui}header,main,nav{max-width:480px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;border-bottom:1px solid #333}main{padding-bottom:110px}h1{font-size:23px}h2{font-size:17px;margin-top:24px}button,input,select,textarea{font:inherit;color:inherit;background:#191919;border:1px solid #393939;border-radius:6px;padding:10px}button{cursor:pointer;min-height:42px;margin:3px}button:disabled{opacity:.4}.primary{background:#ffda29;color:#090909;font-weight:700}input:not([type=checkbox]),select,textarea{display:block;width:100%;font-size:16px;margin:7px 0 15px}textarea{min-height:75px}input[type=checkbox]{accent-color:#ffda29;width:19px;height:19px;vertical-align:middle}label{display:block;margin:10px 0}.card{border:1px solid #333;background:#141414;padding:12px;margin:10px 0;border-radius:8px}.focus{border-color:#ffda29}.meta,small{color:#aaa;font-size:12px}.badge{display:inline-block;border:1px solid #444;padding:2px 5px;font-size:10px;margin:3px}.gold{color:#ffda29}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#101010;border-top:1px solid #333;padding-bottom:max(10px,env(safe-area-inset-bottom))}nav button{flex:1;min-width:0;font-size:11px;padding:8px 2px;margin:2px}.row{display:flex;gap:6px;flex-wrap:wrap}.error{color:#ffb49c}[hidden]{display:none!important}.guide{border:1px solid #66591f;padding:10px;color:#ffda29}a{color:#ffda29}</style>
<header><strong>LIFE / GAME · схема</strong><span id="balance"></span><button onclick="download()">↓ HTML</button></header><main id="app"></main><nav><button onclick="go('blocks')">Блоки</button><button onclick="go('day')">День</button><button onclick="go('quests')">Квесты</button><button onclick="go('habits')">Привычки</button><button onclick="go('shop')">Бонусы</button></nav>
<script>
'use strict';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},week=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
let S,view='blocks',context='',history=[],guide=false,source='';
function reset(){S={date:today(),serial:0,blocks:[],stages:[],tasks:[],quests:[],habits:[],bonuses:[],receipts:{},purchases:[]}}
reset();const uid=()=>String(++S.serial),get=(list,id)=>S[list].find(x=>x.id===id),bal=()=>Object.values(S.receipts).reduce((a,r)=>a+r.reward,0)-S.purchases.reduce((a,p)=>a+p.price,0),weekday=d=>(new Date(d+'T12:00:00').getDay()+6)%7;
function go(v,c=''){history.push([view,context]);view=v;context=c;render();window.scrollTo(0,0)}
function back(){[view,context]=history.pop()||['blocks',''];render()}
const B=(text,action,primary=false)=>`<button ${primary?'class="primary"':''} onclick="${action}">${text}</button>`,field=(label,name,val='',type='text')=>`<label>${label}<input name="${name}" type="${type}" value="${E(val)}" ${type==='number'?'min="0" max="10000" step="1"':''}></label>`,area=(label,name,val='')=>`<label>${label}<textarea name="${name}">${E(val)}</textarea></label>`,check=(label,name,on=false)=>`<label><input type="checkbox" name="${name}" ${on?'checked':''}> ${label}</label>`,opts=(items,value)=>items.map(([id,label])=>`<option value="${E(id)}" ${String(id)===String(value)?'selected':''}>${E(label)}</option>`).join(''),select=(label,name,items,val)=>`<label>${label}<select name="${name}">${opts(items,val)}</select></label>`;
const stageName=id=>{let st=get('stages',id);return st?get('blocks',st.block).name+' · '+st.name:'Без привязки'},stageOpts=()=>[['','Без привязки'],...S.stages.map(s=>[s.id,stageName(s.id)])];
function due(x){let d=x.schedule;if(!d)return true;if(S.date<d.date)return false;return d.kind==='once'?S.date===d.date:d.kind==='daily'?true:d.kind==='weekly'?weekday(S.date)===d.weekday:d.days.includes(weekday(S.date))}
const taskKey=t=>'task:'+t.id+':'+(t.schedule.kind==='once'?'once':S.date),questDone=q=>q.type==='counter'?q.count>=q.target:q.items.every(x=>x.done);
function credit(key,item,on){if(on){if(!S.receipts[key])S.receipts[key]={reward:item.reward}}else if(S.receipts[key]){if(bal()<S.receipts[key].reward)throw Error('Эти демобаллы уже потрачены. Отмена невозможна без сброса примера.');delete S.receipts[key]}}
function taskComplete(id){let t=get('tasks',id);if(!t.inDay||!due(t))return;credit(taskKey(t),t,!S.receipts[taskKey(t)]);render()}
function questChange(id,delta,index){let q=get('quests',id),next=JSON.parse(JSON.stringify(q));if(q.type==='counter')next.count=Math.max(0,Math.min(q.target,q.count+delta));else next.items[index].done=!next.items[index].done;credit('quest:'+id,q,questDone(next));Object.assign(q,next);render()}
function habitChange(id,delta){let h=get('habits',id);if(!due(h))return;let n=Math.max(0,Math.min(h.target,(h.counts[S.date]||0)+delta));credit('habit:'+id+':'+S.date,h,n>=h.target);h.counts[S.date]=n;render()}
function flag(list,id,key,on){let x=get(list,id);if(key==='focus'){x.focus=x.focus.filter(d=>d!==S.date);if(on)x.focus.push(S.date)}else x[key]=on;render()}
function completeStage(id){let st=get('stages',id);if(st.status!=='current')return;st.status='done';let next=S.stages.find(s=>s.block===st.block&&s.status==='planned');if(next)next.status='current';render()}
function startStage(id){let st=get('stages',id);if(st.status==='done')return;S.stages.filter(s=>s.block===st.block&&s.status==='current').forEach(s=>s.status='planned');st.status='current';render()}
function buy(id){let b=get('bonuses',id);if(S.purchases.some(p=>p.id===id))return;if(b.achievement&&get('stages',b.achievement).status!=='done')throw Error('Достижение пока не получено.');if(bal()<b.price)throw Error('Пока не хватает демобаллов.');S.purchases.push({id,price:b.price});render()}
function toggles(list,x){return `<label><input type="checkbox" ${x.inDay?'checked':''} onchange="flag('${list}','${x.id}','inDay',this.checked)"> В Конструкторе дня</label>`}
function taskCard(t,day=false){let focus=t.focus.includes(S.date);return `<article class="card ${focus?'focus':''}"><strong>${E(t.name)}</strong> ${B('Изменить',`openEditor('task','${t.id}')`)}<p class="meta">${E(stageName(t.stage))}<br>${E(scheduleText(t.schedule))} · награда ${t.reward}</p><span class="badge">${t.goal?'Ведёт к цели':'Не ведёт к цели'}</span>${focus?'<span class="badge gold">Фокус дня</span>':''}${toggles('tasks',t)}<label><input type="checkbox" ${focus?'checked':''} onchange="flag('tasks','${t.id}','focus',this.checked)"> В фокусе дня</label>${day?B(S.receipts[taskKey(t)]?'✓ Выполнено · отменить':'Выполнить',`safe(()=>taskComplete('${t.id}'))`,!S.receipts[taskKey(t)]):''}</article>`}
function questCard(q){return `<article class="card"><strong>${E(q.name)}</strong> ${B('Изменить',`openEditor('quest','${q.id}')`)}<p class="meta">${E(stageName(q.stage))} · награда ${q.reward}${questDone(q)?' · завершён':''}</p>${q.type==='counter'?B('−',`safe(()=>questChange('${q.id}',-1))`)+` ${q.count} / ${q.target} `+B('+',`safe(()=>questChange('${q.id}',1))`):q.items.map((x,i)=>`<label><input type="checkbox" ${x.done?'checked':''} onchange="safe(()=>questChange('${q.id}',0,${i}))"> ${E(x.name)}</label>`).join('')}${toggles('quests',q)}</article>`}
function habitCard(h){return `<article class="card"><strong>${E(h.name)}</strong> ${B('Изменить',`openEditor('habit','${h.id}')`)}<p class="meta">${E(stageName(h.stage))}<br>${E(scheduleText(h.schedule))} · награда ${h.reward}</p>${B('−',`safe(()=>habitChange('${h.id}',-1))`)} ${h.counts[S.date]||0} / ${h.target} ${B('+',`safe(()=>habitChange('${h.id}',1))`)}${!due(h)?'<p class="meta">Не запланирована на выбранный день.</p>':''}${toggles('habits',h)}</article>`}
function scheduleText(d){return d.kind==='once'?'Разово · '+d.date:d.kind==='daily'?'Ежедневно':d.kind==='weekly'?'Еженедельно · '+week[d.weekday]:'По дням · '+d.days.map(i=>week[i]).join(', ')}
function scheduleForm(x,habit=false){let d=x?.schedule||{kind:habit?'daily':'once',date:S.date,weekday:weekday(S.date),days:[]};return select('Расписание','repeat',(habit?[]:[['once','Разово']]).concat([['daily','Ежедневно'],['weekly','Еженедельно'],['days','Выбранные дни']]),d.kind)+`<div data-repeat="once">${field('Дата','date',d.date,'date')}</div><div data-repeat="weekly">${select('День недели','weekday',week.map((d,i)=>[i,d]),d.weekday)}</div><div data-repeat="days"><p>Дни недели</p><div class="row">${week.map((n,i)=>`<label><input type="checkbox" name="days" value="${i}" ${d.days.includes(i)?'checked':''}>${n}</label>`).join('')}</div></div><input type="hidden" name="start" value="${d.date}">`}
let editor;
function openEditor(type,id='',stage=''){editor={type,id,stage,returnTo:[view,context]};go('form');}
function visibility(){let r=$('[name=repeat]')?.value,q=$('[name=questType]')?.value;document.querySelectorAll('[data-repeat]').forEach(n=>n.hidden=n.dataset.repeat!==r);document.querySelectorAll('[data-quest]').forEach(n=>n.hidden=n.dataset.quest!==q)}
function formHTML(){let {type,id,stage}=editor,x,title='',body='';
if(type==='block'){title='Новый блок времени';body=field('Название','name',guide?'Гитара':'')+select('Стратегия','mode',[['full','Полная'],['simple','Простая']],'full')+'<p class="meta">В обеих: достижения, фактическое состояние, текущий и планируемые этапы, оптимальный ориентир. В полной дополнительно: Неизвестное и LVMG.</p>';}
if(type==='strategy'){x=get('blocks',id);title='Стратегия · '+x.name;body=area('Зачем тебе это?','purpose',x.purpose||(guide?'Играть любимые песни для себя.':''))+area('Фактическое состояние','factual',x.factual||(guide?'Гитара есть. Начинаю с нуля.':''))+area('Оптимальный ориентир','optimal',x.optimal||(guide?'Уверенно играть 10 любимых песен.':''));if(x.mode==='full')body+=area('Неизвестное','unknown',x.unknown)+area('LVMG','lvmg',x.lvmg);}
if(type==='stage'){x=id?get('stages',id):null;title=x?'Изменить этап':'Добавить этап';body=field('Название','name',x?.name||'')+area('Результат этапа','goal',x?.goal||'');}
if(type==='task'){x=id?get('tasks',id):null;title=x?'Изменить задание':'Новое задание';body=field('Название','name',x?.name||(guide?'10 минут: переходы Am → Em':''))+select('Этап','stage',stageOpts(),x?.stage||stage)+field('Условная награда','reward',x?.reward??25,'number')+scheduleForm(x)+select('Связь с целью','goal',[['yes','Ведёт к цели'],['no','Не ведёт к цели']],x?(x.goal?'yes':'no'):(guide?'yes':'no'))+check('Добавить в Конструктор дня','inDay',x?.inDay??guide)+check('В фокусе дня','focus',Boolean(x?.focus.includes(S.date)))+`<p class="meta">Три настройки независимы. Фокус относится к ${S.date} и сам по себе не добавляет дело в день.</p>`;}
if(type==='quest'){x=id?get('quests',id):null;title='Квест';body=field('Название','name',x?.name||'')+select('Тип','questType',[['counter','Счётчик'],['checklist','Чек-лист']],x?.type||'counter')+`<div data-quest="counter">${field('Сколько раз?','target',x?.target||3,'number')}</div><div data-quest="checklist">${area('Пункты — каждый с новой строки','lines',x?.items.map(i=>i.name).join('\n')||'')}</div>`+field('Награда за весь квест','reward',x?.reward??30,'number')+select('Связь с этапом — необязательно','stage',stageOpts(),x?.stage||stage)+check('В Конструктор напрямую','inDay',x?.inDay||false);}
if(type==='habit'){x=id?get('habits',id):null;title='Привычка';body=field('Название','name',x?.name||'')+field('Сколько раз за день?','target',x?.target||1,'number')+field('Награда за день','reward',x?.reward??5,'number')+scheduleForm(x,true)+select('Связь с этапом — необязательно','stage',stageOpts(),x?.stage||stage)+check('В Конструктор напрямую','inDay',x?.inDay||false);}
if(type==='bonus'){x=id?get('bonuses',id):null;title='Бонус';body=field('Название','name',x?.name||'')+field('Цена в демобаллах','price',x?.price??20,'number')+select('Достижение — пройти этап (необязательно)','achievement',stageOpts(),x?.achievement||'')+'<p class="meta">Достижение только открывает доступ. Получение — вручную.</p>';}
return `<h1>${E(title)}</h1><form id="editor">${body}<p id="error" class="error" role="alert"></p>${B('Отмена','back()')}<button type="submit" class="primary">Сохранить</button></form>`;}
function save(e){e.preventDefault();try{let f=new FormData(e.target),v=n=>f.get(n)||'',n=name=>{let x=Number(v(name));if(!Number.isInteger(x)||x<0||x>10000)throw Error('Проверь числа: от 0 до 10000.');return x},name=v('name').trim(),{type,id,stage}=editor;if(['block','stage','task','quest','habit','bonus'].includes(type)&&(!name||name.length>140))throw Error('Введи название до 140 символов.');let x;
if(type==='block'){x={id:uid(),name,mode:v('mode'),configured:false};S.blocks.push(x);S.stages.push({id:uid(),block:x.id,name:guide?'Первые аккорды':'Сейчас',status:'current',goal:''},{id:uid(),block:x.id,name:'Планируемый',status:'planned',goal:''});view='block';context=x.id;history=[];openEditor('strategy',x.id);return;}
if(type==='strategy'){x=get('blocks',id);for(let k of ['purpose','factual','optimal','unknown','lvmg'])x[k]=v(k);x.configured=true;}
if(type==='stage'){x=id?get('stages',id):{id:uid(),block:stage,status:'planned'};Object.assign(x,{name,goal:v('goal')});if(!id)S.stages.push(x);}
if(type==='task'||type==='habit'){let kind=v('repeat'),date=kind==='once'?v('date'):v('start'),days=f.getAll('days').map(Number);if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))throw Error('Выбери дату.');if(kind==='days'&&!days.length)throw Error('Выбери дни недели.');if(type==='task'&&!v('stage'))throw Error('Выбери этап.');let list=type==='task'?'tasks':'habits';x=id?get(list,id):{id:uid(),focus:[],counts:{}};let target=type==='habit'?n('target'):1;if(target<1)throw Error('Количество должно быть от 1.');let next={...x,name,stage:v('stage'),reward:n('reward'),inDay:f.has('inDay'),schedule:{kind,date,weekday:n('weekday'),days},target,goal:v('goal')==='yes'};if(type==='habit')credit('habit:'+next.id+':'+S.date,next,(next.counts[S.date]||0)>=target);Object.assign(x,next);if(type==='task'){x.focus=x.focus.filter(d=>d!==S.date);if(f.has('focus'))x.focus.push(S.date)}if(!id)S[list].push(x);}
if(type==='quest'){let qt=v('questType'),target=n('target'),lines=v('lines').split('\n').map(x=>x.trim()).filter(Boolean);if(qt==='counter'&&target<1)throw Error('Количество должно быть от 1.');if(qt==='checklist'&&!lines.length)throw Error('Добавь пункты чек-листа.');x=id?get('quests',id):{id:uid(),count:0,items:[]};let next={...x,name,type:qt,target,stage:v('stage'),reward:n('reward'),inDay:f.has('inDay'),count:Math.min(x.count,target),items:lines.map((name,i)=>({name,done:x.items[i]?.name===name&&x.items[i].done||false}))};credit('quest:'+next.id,next,questDone(next));Object.assign(x,next);if(!id)S.quests.push(x);}
if(type==='bonus'){x=id?get('bonuses',id):{id:uid()};Object.assign(x,{name,price:n('price'),achievement:v('achievement')});if(!id)S.bonuses.push(x);}
[view,context]=editor.returnTo;history.pop();render();}catch(err){$('#error').textContent=err.message}}
function seed(){reset();guide=false;let b={id:uid(),name:'Обучение игре на гитаре',mode:'full',configured:true,purpose:'Играть любимые песни для себя.',factual:'Гитара есть, начинаю с нуля.',optimal:'Уверенно играть 10 любимых песен.',unknown:'Найти свой стиль.',lvmg:'Записать собственную музыку.'};S.blocks.push(b);let st={id:uid(),block:b.id,name:'Первые аккорды',status:'current',goal:'Чисто брать Am и Em.'};S.stages.push(st,{id:uid(),block:b.id,name:'Первая песня',status:'planned',goal:''});for(let [name,reward,goal,inDay,focus,kind]of [['10 минут: переходы Am → Em',25,true,true,true,'daily'],['Настроить гитару',10,false,true,false,'once'],['Найти разбор песни',15,true,false,true,'weekly']])S.tasks.push({id:uid(),stage:st.id,name,reward,goal,inDay,focus:focus?[S.date]:[],schedule:{kind,date:S.date,weekday:weekday(S.date),days:[]}});S.quests.push({id:uid(),name:'Три чистых перехода подряд',type:'counter',count:0,target:3,items:[],reward:30,stage:st.id,inDay:true},{id:uid(),name:'Разобрать первую песню',type:'checklist',count:0,target:1,items:['Выбрать песню','Разобрать аккорды','Сыграть куплет'].map(name=>({name,done:false})),reward:50,stage:'',inDay:true});S.habits.push({id:uid(),name:'Взять гитару в руки',reward:5,target:1,stage:st.id,inDay:true,counts:{},schedule:{kind:'daily',date:S.date,weekday:0,days:[]}});S.bonuses.push({id:uid(),name:'Новый медиатор',price:40,achievement:st.id},{id:uid(),name:'20 минут любимой музыки',price:10,achievement:''});history=[];view='blocks';render()}
function begin(){reset();guide=true;view='blocks';history=[];openEditor('block')}
function render(){let h='',b=get('blocks',context),st=get('stages',context);$('#balance').textContent='Демо: '+bal();
if(view==='blocks')h='<h1>Блоки времени</h1>'+B('+ Создать блок',"openEditor('block')",true)+S.blocks.map(b=>`<article class="card"><strong>${E(b.name)}</strong><p class="meta">${b.mode==='full'?'Полная':'Простая'} стратегия</p>${B('Стратегия и этапы',`go('block','${b.id}')`)}</article>`).join('')+`<section class="card"><strong>Пример: обучение гитаре</strong><p class="meta">Пройди создание стратегии, добавь дела, отметь фокус и выполни их в дне.</p>${B('Пройти с нуля','begin()',true)}${B('Готовый пример','seed()')}</section>`;
if(view==='block'&&b){let stages=S.stages.filter(s=>s.block===b.id);h=`<h1>${E(b.name)}</h1><p>${E(b.purpose||'')}</p>${B(b.configured?'Изменить стратегию':'Создать стратегию',`openEditor('strategy','${b.id}')`,true)}<article class="card">${B('Достижения · '+stages.filter(s=>s.status==='done').length,`go('achievements','${b.id}')`)}</article><article class="card"><strong>Фактическое состояние</strong><p>${E(b.factual||'Опиши точку старта.')}</p></article><h2>Текущий этап</h2>`+stages.filter(s=>s.status==='current').map(stageCard).join('')+'<h2>Планируемые этапы</h2>'+stages.filter(s=>s.status==='planned').map(stageCard).join('')+B('+ Добавить этап',`openEditor('stage','','${b.id}')`)+`<article class="card"><strong>Оптимальный ориентир</strong><p>${E(b.optimal||'Опиши желаемый результат.')}</p></article>`+(b.mode==='full'?`<article class="card"><strong>Неизвестное</strong><p>${E(b.unknown||'Пока открыто.')}</p></article><article class="card"><strong>LVMG</strong><p>${E(b.lvmg||'Дальше привычных представлений.')}</p></article>`:'');}
if(view==='stage'&&st){h=`<p class="meta">${E(stageName(st.id))} · ${E(st.status==='current'?'Текущий':st.status==='planned'?'Планируемый':'Пройден')}</p><h1>${E(st.name)}</h1><p>${E(st.goal)}</p>${B('Изменить этап',`openEditor('stage','${st.id}')`)}${st.status==='planned'?B('Сделать текущим',`startStage('${st.id}')`):''}<h2>Задания</h2>${B('+ Задание',`openEditor('task','','${st.id}')`,true)}`+S.tasks.filter(t=>t.stage===st.id).map(t=>taskCard(t)).join('')+`<h2>Квесты этапа</h2>${B('+ Квест',`openEditor('quest','','${st.id}')`)}`+S.quests.filter(q=>q.stage===st.id).map(questCard).join('')+`<h2>Привычки этапа</h2>${B('+ Привычка',`openEditor('habit','','${st.id}')`)}`+S.habits.filter(x=>x.stage===st.id).map(habitCard).join('')+`<hr>${B('Перейти в Конструктор дня',"go('day')",true)}${st.status==='current'?B('Отметить этап пройденным',`completeStage('${st.id}')`):''}`;}
if(view==='achievements'&&b)h='<h1>Достижения</h1>'+S.stages.filter(s=>s.block===b.id&&s.status==='done').map(s=>`<article class="card">✓ ${E(s.name)}</article>`).join('')+'<p class="meta">Бонусы не выдаются автоматически.</p>'+B('Магазин',"go('shop')");
if(view==='day'){let tasks=S.tasks.filter(t=>t.inDay&&due(t));h='<h1>Конструктор дня</h1>'+`<input type="date" value="${S.date}" onchange="S.date=this.value;render()"><p class="meta">Явно включённые дела по расписанию. Фокус и связь с целью не включают задания автоматически.</p>`+B('Выбрать из созданного',"go('picker')")+'<h2>В фокусе дня</h2>'+(tasks.filter(t=>t.focus.includes(S.date)).map(t=>taskCard(t,true)).join('')||'<p class="meta">Пока нет ключевых действий.</p>')+'<h2>Остальные задания</h2>'+tasks.filter(t=>!t.focus.includes(S.date)).map(t=>taskCard(t,true)).join('')+'<h2>Квесты</h2>'+S.quests.filter(q=>q.inDay).map(questCard).join('')+'<h2>Привычки</h2>'+S.habits.filter(h=>h.inDay&&due(h)).map(habitCard).join('');}
if(view==='picker')h='<h1>Состав Конструктора</h1><p class="meta">Расписание остаётся в силе. Фокус не заменяет включение.</p>'+[['tasks','Задания'],['quests','Квесты'],['habits','Привычки']].map(([list,name])=>'<h2>'+name+'</h2>'+S[list].map(x=>`<article class="card">${E(x.name)}${toggles(list,x)}</article>`).join('')).join('')+B('Открыть день',"go('day')",true);
if(view==='quests')h='<h1>Квесты</h1><p class="meta">Самостоятельный раздел. Можно связать с этапом или включить в день напрямую.</p>'+B('+ Создать квест',"openEditor('quest')",true)+S.quests.map(questCard).join('');
if(view==='habits')h='<h1>Привычки</h1><p class="meta">Самостоятельный раздел с необязательной связью с этапом.</p>'+B('+ Создать привычку',"openEditor('habit')",true)+S.habits.map(habitCard).join('');
if(view==='shop')h='<h1>Магазин бонусов</h1><p class="meta">Достижение открывает доступ. Получение только вручную.</p>'+B('+ Добавить бонус',"openEditor('bonus')")+S.bonuses.map(b=>{let bought=S.purchases.some(p=>p.id===b.id),available=!b.achievement||get('stages',b.achievement).status==='done';return `<article class="card"><strong>${E(b.name)}</strong><p class="meta">Цена: ${b.price} демобаллов${b.achievement?'<br>Достижение: '+E(stageName(b.achievement)):''}</p><button onclick="safe(()=>buy('${b.id}'))" ${bought||!available?'disabled':''}>${bought?'✓ Получен':available?'Получить вручную':'Достижение пока не получено'}</button></article>`}).join('');
if(view==='form')h=formHTML();$('#app').innerHTML=(view!=='blocks'?B('← Назад','back()'):'')+(guide?'<p class="guide">Создай блок → опиши стратегию → открой этап → добавь задание → отметь фокус → выполни в Конструкторе.</p>':'')+h+'<p class="meta">Схематичное демо. Только вымышленные данные в памяти страницы.</p>';if($('#editor')){$('#editor').onsubmit=save;$('#editor').onchange=visibility;visibility()}}
function stageCard(st){return `<article class="card"><strong>${E(st.name)}</strong><p class="meta">${E(st.goal)}</p>${B('Открыть',`go('stage','${st.id}')`)}</article>`}
function safe(fn){try{fn()}catch(e){render();alert(e.message)}}
function download(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([source],{type:'text/html;charset=utf-8'}));a.href=u;a.download='lifegame-flow-schematic.html';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
window.addEventListener('DOMContentLoaded',()=>source='<!doctype html>\n'+document.documentElement.outerHTML,{once:true});render();
</script></html>
